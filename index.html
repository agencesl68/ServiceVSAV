<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kits VSAV">
<title>Kits VSAV — CS Seppois-le-Bas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  color-scheme: light;           /* app terrain : fond clair imposé, jamais de dark auto */

  --brand:        #E10717;   /* rouge relevé sur le logo SDIS 68 */
  --brand-dark:   #C10614;
  --brand-darker: #9E0510;
  --on-brand:     #FFFFFF;

  --bg:        #F1F3F6;
  --surface:   #FFFFFF;
  --surface-2: #F8FAFC;
  --fg:        #0F172A;
  --fg-2:      #475569;
  --fg-3:      #64748B;
  --border:    #E2E6EC;
  --border-2:  #CBD5E1;

  /* palette data — validée (validate_palette.js, mode light) */
  --data:      #2563EB;
  --data-soft: #DBEAFE;

  --ok:        #15803D;  --ok-bg:   #DCFCE7;  --ok-fg:   #14532D;
  --warn:      #CA8A04;  --warn-bg: #FEF9C3;  --warn-fg: #854D0E;
  --crit:      #B91C1C;  --crit-bg: #FEE2E2;  --crit-fg: #7F1D1D;

  --r-sm: 8px; --r: 12px; --r-lg: 16px; --r-xl: 22px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;

  --sh-1: 0 1px 2px rgba(15,23,42,.06), 0 1px 1px rgba(15,23,42,.04);
  --sh-2: 0 4px 12px rgba(15,23,42,.08), 0 1px 3px rgba(15,23,42,.05);
  --sh-3: 0 12px 32px rgba(15,23,42,.16);

  --ff: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --nav-h: 62px;
  --bar-h: 0px;      /* hauteur de la barre d'action collante quand elle est visible */
  --dur: 180ms;
  --ease: cubic-bezier(.2,.7,.3,1);
  --ease-ressort: cubic-bezier(.2,1.12,.35,1);   /* léger dépassement, pour ce qui apparaît */
  --dur-appui: 110ms;                            /* retour tactile : doit précéder le doigt */
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--ff); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:contain;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;      /* deux appuis rapides ne zooment plus */
}

/* Une commande ne se sélectionne pas et ne zoome pas : sur le terrain, avec
   des gants, on tape vite et deux fois de suite sans le vouloir.
   Le pincer-pour-zoomer de la page reste possible — on ne le bloque jamais,
   c'est le seul recours de quelqu'un qui voit mal.                          */
button, .chip, .type-pick, .picker-item, .type-head, .seg button, .keypad button, .nav button{
  touch-action:manipulation;
  -webkit-user-select:none; user-select:none;
}
h1,h2,h3,h4{margin:0; line-height:1.25; letter-spacing:-0.015em}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}
[hidden]{display:none!important}

:focus-visible{outline:3px solid #2563EB; outline-offset:2px; border-radius:4px}

/* ============================================================
   APP SHELL
   ============================================================ */
#app{min-height:100dvh; display:flex; flex-direction:column}
.shell{
  width:100%; max-width:820px; margin:0 auto; flex:1;
  display:flex; flex-direction:column;
}
.topbar{
  position:sticky; top:0; z-index:40;
  background:var(--surface); color:var(--brand);
  padding: max(env(safe-area-inset-top), 8px) var(--s4) 0;
  border-bottom:1px solid var(--border);
  box-shadow:0 1px 3px rgba(15,23,42,.05);
}
.topbar-in{
  max-width:820px; margin:0 auto;
  min-height:56px; display:flex; align-items:center; gap:var(--s3);
}
.topbar h1{font-size:17px; font-weight:700; letter-spacing:-0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.topbar .sub{font-size:12px; color:var(--brand); font-weight:600; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.topbar .spacer{flex:1}
.icon-btn{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:44px; min-height:44px; border:0; background:transparent;
  color:inherit; border-radius:var(--r); transition:background var(--dur) var(--ease);
}
.icon-btn:hover{background:rgba(255,255,255,.14)}
.icon-btn:active{background:rgba(255,255,255,.24); transform:scale(.9)}
.icon-btn{transition:background var(--dur) var(--ease), transform var(--dur-appui) var(--ease)}
.icon-btn[aria-current="page"]{background:rgba(255,255,255,.22)}
.topbar .icon-btn:hover{background:rgba(225,7,23,.09)}
.topbar .icon-btn:active{background:rgba(225,7,23,.16)}
.topbar .icon-btn[aria-current="page"]{background:rgba(225,7,23,.13)}
.icon-btn.dark{color:var(--fg-2)}
.icon-btn.dark:hover{background:#0f172a12}

.crest-logo{ width:42px; height:42px; flex:none; object-fit:contain; }
.crest{
  width:38px; height:38px; border-radius:10px; flex:none;
  background:#fff; color:var(--brand-dark);
  display:grid; place-items:center; box-shadow:var(--sh-1);
}

.bandeau-demo{
  display:flex; align-items:flex-start; gap:9px;
  background:var(--warn-bg); color:var(--warn-fg);
  border-bottom:1px solid #FDE68A; padding:11px var(--s4);
  font-size:12.5px; font-weight:600; line-height:1.4;
}
.bandeau-demo .ic{flex:none; margin-top:1px}

main{flex:1; padding:var(--s4) var(--s4) calc(var(--nav-h) + var(--bar-h) + env(safe-area-inset-bottom) + var(--s6));
     transition:padding-bottom var(--dur) var(--ease)}
/* Le contenu glisse, le bandeau et la barre du bas restent en place : on ne
   déplace que ce qui change vraiment de sens. Repli sur un fondu simple quand
   le navigateur ne connaît pas l'API View Transitions.                       */
.sans-vt .view{animation:fade var(--dur) var(--ease)}
@keyframes fade{from{opacity:0; transform:translateY(4px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion: no-preference) {
  .topbar{view-transition-name:bandeau}
  main{view-transition-name:contenu}
  .nav{view-transition-name:navigation}

  ::view-transition-old(contenu), ::view-transition-new(contenu){
    animation-duration:260ms; animation-timing-function:var(--ease);
  }
  ::view-transition-old(bandeau), ::view-transition-new(bandeau),
  ::view-transition-old(navigation), ::view-transition-new(navigation){
    animation-duration:160ms;
  }
  html[data-sens="avant"]::view-transition-old(contenu){animation-name:glisserSortieG}
  html[data-sens="avant"]::view-transition-new(contenu){animation-name:glisserEntreeD}
  html[data-sens="arriere"]::view-transition-old(contenu){animation-name:glisserSortieD}
  html[data-sens="arriere"]::view-transition-new(contenu){animation-name:glisserEntreeG}
}
@keyframes glisserSortieG{to{opacity:0; transform:translateX(-22px)}}
@keyframes glisserEntreeD{from{opacity:0; transform:translateX(22px)}}
@keyframes glisserSortieD{to{opacity:0; transform:translateX(22px)}}
@keyframes glisserEntreeG{from{opacity:0; transform:translateX(-22px)}}

/* Apparition en cascade, plafonnée : sur un historique de 400 lignes, une
   cascade complète mettrait plusieurs secondes et donnerait l'impression que
   l'app rame.                                                                */
@media (prefers-reduced-motion: no-preference) {
  .cascade > *{animation:monter 300ms var(--ease) backwards}
  .cascade > *:nth-child(2){animation-delay:40ms}
  .cascade > *:nth-child(3){animation-delay:80ms}
  .cascade > *:nth-child(4){animation-delay:120ms}
  .cascade > *:nth-child(5){animation-delay:160ms}
  .cascade > *:nth-child(6){animation-delay:200ms}
  .cascade > *:nth-child(n+7){animation-delay:240ms}
}
@keyframes monter{from{opacity:0; transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============================================================
   BOTTOM NAV
   ============================================================ */
.nav{
  position:fixed; left:0; right:0; bottom:0; z-index:45;
  background:rgba(255,255,255,.94); backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-in{max-width:820px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr)}
.nav button{
  border:0; background:transparent; color:var(--fg-3);
  min-height:var(--nav-h); display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; font-size:11px; font-weight:600;
  transition:color var(--dur) var(--ease); position:relative;
}
.nav button .ic{transition:transform var(--dur) var(--ease)}
.nav button:active .ic{transform:scale(.9)}
.nav button[aria-current="page"]{color:var(--brand-dark)}
.nav button[aria-current="page"]::before{
  content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:28px; height:3px; border-radius:0 0 3px 3px; background:var(--brand);
}
.nav .badge{
  position:absolute; top:8px; left:calc(50% + 8px);
  min-width:17px; height:17px; padding:0 4px; border-radius:9px;
  background:var(--brand); color:#fff; font-size:10px; font-weight:800;
  display:grid; place-items:center; line-height:1;
}

/* ============================================================
   PRIMITIVES
   ============================================================ */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--sh-1)}
.card + .card{margin-top:var(--s3)}
.pad{padding:var(--s4)}

.section-title{
  display:flex; align-items:center; gap:var(--s2);
  font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase;
  color:var(--fg-3); margin:var(--s5) 0 var(--s3);
}
.section-title:first-child{margin-top:0}
.section-title .spacer{flex:1}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  min-height:48px; padding:0 var(--s5); border-radius:var(--r);
  border:1px solid transparent; font-weight:700; font-size:15px;
  transition:background var(--dur) var(--ease), transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none}
.btn-primary{background:var(--brand); color:#fff; box-shadow:var(--sh-1)}
.btn-primary:hover:not(:disabled){background:var(--brand-dark)}
.btn-dark{background:var(--fg); color:#fff}
.btn-dark:hover:not(:disabled){background:#1e293b}
.btn-ghost{background:var(--surface); border-color:var(--border-2); color:var(--fg)}
.btn-ghost:hover:not(:disabled){background:var(--surface-2)}
.btn-soft{background:var(--surface-2); border-color:var(--border); color:var(--fg-2)}
.btn-soft:hover:not(:disabled){background:#eef2f7}
.btn-block{width:100%}
.btn-sm{min-height:44px; padding:0 14px; font-size:13.5px; border-radius:var(--r-sm)}

.field{margin-bottom:var(--s4)}
.field:last-child{margin-bottom:0}
.label{display:block; font-size:13px; font-weight:700; color:var(--fg-2); margin-bottom:6px}
.label .req{color:var(--brand); margin-left:2px}
.hint{font-size:12px; color:var(--fg-3); margin-top:6px; line-height:1.4}
.inp{
  width:100%; min-height:48px; padding:0 var(--s3); background:var(--surface);
  border:1.5px solid var(--border-2); border-radius:var(--r); font-size:16px;
  transition:border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
textarea.inp{padding:var(--s3); min-height:80px; resize:vertical}
.inp:focus{outline:none; border-color:var(--data); box-shadow:0 0 0 3px #2563eb26}
.inp[aria-invalid="true"]{border-color:var(--crit); background:#fff5f5}
.err{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--crit-fg); margin-top:6px}
.inp-group{display:flex; gap:var(--s2)}
.inp-group .inp{flex:1}

.seg{display:flex; gap:var(--s1); background:var(--surface-2); border:1px solid var(--border); padding:4px; border-radius:var(--r)}
.seg button{
  flex:1; min-height:44px; border:0; border-radius:var(--r-sm); background:transparent;
  font-size:13px; font-weight:700; color:var(--fg-3);
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease),
             transform var(--dur-appui) var(--ease);
  white-space:nowrap; padding:0 6px;
}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--fg); box-shadow:var(--sh-1)}
.seg button:active{transform:scale(.96)}

.chips{display:flex; gap:var(--s2); flex-wrap:wrap}
.chip{
  display:inline-flex; align-items:center; gap:7px; min-height:44px; padding:0 15px;
  border-radius:999px; border:1px solid var(--border-2); background:var(--surface);
  font-size:13px; font-weight:600; color:var(--fg-2);
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease),
             border-color var(--dur) var(--ease), transform var(--dur-appui) var(--ease);
}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{background:var(--fg); color:#fff; border-color:var(--fg)}
.dot{display:inline-block; width:9px; height:9px; border-radius:3px; flex:none; vertical-align:middle;
  box-shadow:inset 0 0 0 1px rgba(15,23,42,.16)}

.badge{
  display:inline-flex; align-items:center; gap:5px; padding:3px 8px; border-radius:999px;
  font-size:11.5px; font-weight:800; letter-spacing:.01em; white-space:nowrap;
}
.badge.ok{background:var(--ok-bg); color:var(--ok-fg)}
.badge.warn{background:var(--warn-bg); color:var(--warn-fg)}
.badge.crit{background:var(--crit-bg); color:var(--crit-fg)}
.badge.neutral{background:var(--surface-2); color:var(--fg-3); border:1px solid var(--border)}
.badge.info{background:var(--data-soft); color:#1E3A8A}

.empty{
  text-align:center; padding:var(--s7) var(--s4); color:var(--fg-3);
}
.empty .ic{color:var(--border-2); margin-bottom:var(--s3)}
.empty p{margin:0; font-size:14px}
.empty strong{display:block; color:var(--fg-2); font-size:15px; margin-bottom:4px}

.row{display:flex; align-items:center; gap:var(--s3)}
.row .spacer{flex:1}
.stack{display:flex; flex-direction:column; gap:var(--s3)}
.divider{height:1px; background:var(--border); margin:var(--s3) 0}
.list > * + *{border-top:1px solid var(--border)}

/* KPI */
.kpis{display:grid; grid-template-columns:repeat(2,1fr); gap:var(--s2)}
@media(min-width:600px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  padding:var(--s3); box-shadow:var(--sh-1); text-align:left;
}
.kpi .k-label{display:flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; color:var(--fg-3); text-transform:uppercase; letter-spacing:.05em}
.kpi .k-val{font-size:27px; font-weight:800; letter-spacing:-0.03em; margin-top:2px; line-height:1.1}
.kpi .k-sub{font-size:12px; color:var(--fg-3); font-weight:600}
.kpi.is-crit .k-val{color:var(--crit)}
.kpi.is-warn .k-val{color:var(--warn-fg)}
.kpi.is-ok .k-val{color:var(--ok)}

/* toast */
.toasts{position:fixed; left:0; right:0; bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px); z-index:80; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; padding:0 var(--s4)}
.toast{
  display:flex; align-items:center; gap:10px; max-width:520px; width:100%;
  background:var(--fg); color:#fff; padding:12px var(--s4); border-radius:var(--r);
  box-shadow:var(--sh-3); font-size:14px; font-weight:600;
  animation:toastIn 260ms var(--ease-ressort);
}
.toast.ok{background:#166534}
.toast.err{background:var(--brand-dark)}
@keyframes toastIn{from{opacity:0; transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}

/* sheet / modal */
.scrim{position:fixed; inset:0; background:rgba(15,23,42,.52); z-index:60; animation:fade 160ms var(--ease)}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:61;
  background:var(--surface); border-radius:var(--r-xl) var(--r-xl) 0 0;
  max-height:88dvh; display:flex; flex-direction:column;
  box-shadow:var(--sh-3); animation:sheetIn 300ms var(--ease-ressort);
  padding-bottom:env(safe-area-inset-bottom);
}
@media(min-width:640px){
  .sheet{max-width:560px; margin:0 auto; border-radius:var(--r-xl); bottom:24px; left:16px; right:16px}
}
@keyframes sheetIn{from{transform:translateY(24px); opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex; align-items:center; gap:var(--s2); padding:var(--s4) var(--s4) var(--s3); border-bottom:1px solid var(--border)}
.sheet-head h3{font-size:17px; font-weight:700; flex:1}
.sheet-body{overflow:auto; padding:var(--s4); -webkit-overflow-scrolling:touch}
.sheet-foot{padding:var(--s3) var(--s4) var(--s4); border-top:1px solid var(--border); background:var(--surface-2); border-radius:0 0 var(--r-xl) var(--r-xl)}

/* sticky action bar */
.stickybar{
  position:fixed; left:0; right:0; bottom:var(--nav-h); z-index:44;
  background:rgba(255,255,255,.96); backdrop-filter:blur(12px);
  border-top:1px solid var(--border); padding:var(--s3) var(--s4);
  padding-bottom:calc(var(--s3));
  animation:sheetIn 220ms var(--ease);
}
.stickybar-in{max-width:820px; margin:0 auto; display:flex; align-items:center; gap:var(--s3)}

/* ============================================================
   KIT / STOCK
   ============================================================ */
.type-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--sh-1); overflow:hidden}
.type-card + .type-card{margin-top:var(--s2)}
.type-head{display:flex; align-items:center; gap:var(--s3); padding:var(--s3) var(--s4); width:100%; border:0; background:transparent; text-align:left; min-height:64px;
  transition:background var(--dur) var(--ease), transform var(--dur-appui) var(--ease)}
.type-head:hover{background:var(--surface-2)}
.type-head:active{background:#eef2f7; transform:scale(.982)}
.type-name{font-size:15px; font-weight:700; letter-spacing:-.01em}
.type-meta{font-size:12.5px; color:var(--fg-3); font-weight:600; margin-top:1px}
.type-right{display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex:none}
.type-count{display:block; font-size:20px; font-weight:800; letter-spacing:-.02em; line-height:1}
.type-count small{font-size:13px; font-weight:700; color:var(--fg-3)}
.chev{color:var(--border-2); transition:transform var(--dur) var(--ease)}
.type-head[aria-expanded="true"] .chev{transform:rotate(90deg)}

.gauge{display:block; height:6px; border-radius:3px; background:var(--border); overflow:hidden; width:78px}
.gauge i{display:block; height:100%; border-radius:3px; background:var(--ok);
  transition:width 300ms var(--ease); transform-origin:left; animation:remplir 420ms var(--ease) backwards}
.gauge.low i{background:var(--warn)}
.gauge.none i{background:var(--crit)}

.kit-row{display:flex; align-items:center; gap:var(--s3); padding:11px var(--s4); background:var(--surface-2)}
.kit-row + .kit-row{border-top:1px solid var(--border)}
.kit-no{font-size:15px; font-weight:800; letter-spacing:.01em; min-width:64px}
.kit-per{font-size:12.5px; color:var(--fg-3); font-weight:600}

.picker-item{
  display:flex; align-items:center; gap:var(--s3); width:100%; text-align:left;
  padding:var(--s3); border:1.5px solid var(--border); border-radius:var(--r);
  background:var(--surface); min-height:60px;
  transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease),
             box-shadow var(--dur) var(--ease), transform var(--dur-appui) var(--ease);
}
.picker-item + .picker-item{margin-top:var(--s2)}
.picker-item:hover{border-color:var(--border-2); background:var(--surface-2)}
.picker-item:active{transform:scale(.985)}
.picker-item[aria-pressed="true"]{border-color:var(--data); background:#eff6ff; box-shadow:0 0 0 3px #2563eb1f}
.picker-item .fefo{font-size:10.5px; font-weight:800; letter-spacing:.05em; color:var(--data); text-transform:uppercase}

.cart-item{display:flex; align-items:center; gap:var(--s3); padding:11px var(--s3); background:var(--surface); border:1px solid var(--border); border-radius:var(--r)}
.cart-item + .cart-item{margin-top:var(--s2)}

/* type grid (entrée) */
.type-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:var(--s2)}
@media(min-width:520px){.type-grid{grid-template-columns:repeat(3,1fr)}}
.type-pick{
  display:flex; flex-direction:column; align-items:flex-start; gap:5px;
  padding:var(--s3); border:1.5px solid var(--border); border-radius:var(--r);
  background:var(--surface); min-height:70px; text-align:left;
  transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease),
             color var(--dur) var(--ease), transform var(--dur-appui) var(--ease);
  font-size:13.5px; font-weight:700; line-height:1.25;
}
.type-pick:hover{background:var(--surface-2); border-color:var(--border-2)}
.type-pick:active{transform:scale(.97)}
.type-pick[aria-pressed="true"]{border-color:var(--fg); background:var(--fg); color:#fff}
.type-pick[aria-pressed="true"] .tp-sub{color:#ffffffb0}
.tp-sub{font-size:11.5px; font-weight:600; color:var(--fg-3)}

/* ============================================================
   LOGIN
   ============================================================ */
.login{
  position:relative; min-height:100dvh; display:flex; flex-direction:column;
  justify-content:center; align-items:center; padding:var(--s5) var(--s4);
  background:linear-gradient(170deg,#E10717 0%,#9E0510 44%,#0F172A 100%);
  overflow:hidden;
}
/* Photo de fond passée en noir et blanc… */
.login-fond{
  position:absolute; inset:0; background-size:cover; background-position:center;
  filter:grayscale(1) brightness(1.06) contrast(1.03);
}
/* …puis voilée de rouge, comme le portail du SDIS. */
.login-voile{
  position:absolute; inset:0;
  background:radial-gradient(circle at 50% 42%,
    rgba(225,7,23,.56) 0%, rgba(150,5,16,.76) 62%, rgba(15,23,42,.88) 100%);
}
.login-card{position:relative; z-index:1; width:100%; max-width:380px; background:var(--surface); border-radius:var(--r-xl); box-shadow:var(--sh-3); padding:var(--s5); animation:fade 300ms var(--ease)}
.login-logo{display:block; width:120px; height:120px; object-fit:contain; margin:0 auto var(--s4)}
.login-crest{width:56px; height:56px; border-radius:16px; background:var(--brand); color:#fff; display:grid; place-items:center; margin:0 auto var(--s3); box-shadow:0 6px 16px rgba(225,7,23,.28)}
.login h2{text-align:center; font-size:21px; font-weight:800; letter-spacing:-.02em}
.login .org{text-align:center; font-size:13px; color:var(--fg-3); font-weight:600; margin-top:3px; margin-bottom:var(--s5)}
.pin-display{display:flex; justify-content:center; gap:10px; margin-bottom:var(--s4)}
.pin-dot{width:14px; height:14px; border-radius:50%; background:var(--border); transition:all var(--dur) var(--ease)}
.pin-dot.on{background:var(--brand); transform:scale(1.15)}
.pin-display.shake{animation:shake 400ms}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s2)}
.keypad button{
  min-height:58px; border-radius:var(--r); border:1px solid var(--border);
  background:var(--surface-2); font-size:21px; font-weight:700;
  transition:all 120ms var(--ease); display:grid; place-items:center;
}
.keypad button:hover{background:#eef2f7}
.keypad button:active{background:var(--border); transform:scale(.95)}
.keypad button.fn{background:transparent; border-color:transparent; color:var(--fg-3)}
.demo-codes{margin-top:var(--s4); padding:var(--s3); background:var(--surface-2); border:1px dashed var(--border-2); border-radius:var(--r); font-size:12px; color:var(--fg-3); line-height:1.6}
.demo-codes b{color:var(--fg-2)}

/* ============================================================
   SCANNER
   ============================================================ */
.scanner{position:fixed; inset:0; z-index:90; background:#000; display:flex; flex-direction:column}
.scanner video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.scan-frame{position:absolute; inset:0; display:grid; place-items:center; pointer-events:none}
.scan-box{width:min(70vw,270px); aspect-ratio:1; border-radius:20px; box-shadow:0 0 0 100vmax rgba(0,0,0,.55); position:relative}
.scan-box::before,.scan-box::after{content:''; position:absolute; width:38px; height:38px; border:4px solid #fff; border-radius:6px}
.scan-box::before{top:-2px; left:-2px; border-right:0; border-bottom:0; border-radius:14px 0 0 0}
.scan-box::after{bottom:-2px; right:-2px; border-left:0; border-top:0; border-radius:0 0 14px 0}
.scan-line{position:absolute; left:8%; right:8%; height:3px; border-radius:3px; background:var(--brand); box-shadow:0 0 14px #dc2626; animation:scanline 2.1s ease-in-out infinite}
@keyframes scanline{0%,100%{top:10%}50%{top:88%}}
.scan-top{position:relative; z-index:2; padding:max(env(safe-area-inset-top),12px) var(--s4) var(--s3); display:flex; align-items:center; gap:var(--s2); color:#fff}
.scan-top h3{flex:1; font-size:16px; font-weight:700}
.scan-bottom{position:relative; z-index:2; margin-top:auto; padding:var(--s4); padding-bottom:calc(env(safe-area-inset-bottom) + 16px); color:#fff; text-align:center}
.scan-bottom p{font-size:14px; margin:0 0 var(--s3); text-shadow:0 1px 6px rgba(0,0,0,.7)}
.scan-raw{background:#ffffff1a; border:1px solid #ffffff33; border-radius:var(--r); padding:var(--s3); font-size:12px; word-break:break-all; text-align:left; margin-bottom:var(--s3)}

/* ============================================================
   HISTORIQUE
   ============================================================ */
.day-head{display:flex; align-items:baseline; gap:var(--s2); margin:var(--s5) 0 var(--s2); padding:0 2px}
.day-head h4{font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--fg-2)}
.day-head span{font-size:12px; color:var(--fg-3); font-weight:600}
.mv{display:flex; align-items:flex-start; gap:var(--s3); padding:var(--s3) var(--s4); background:var(--surface)}
.mv-ic{width:32px; height:32px; border-radius:9px; display:grid; place-items:center; flex:none; margin-top:1px}
.mv-ic.in{background:var(--ok-bg); color:var(--ok)}
.mv-ic.out{background:var(--crit-bg); color:var(--crit)}
.mv-main{flex:1; min-width:0}
.mv-t{font-size:14.5px; font-weight:700; letter-spacing:-.01em}
.mv-s{font-size:12.5px; color:var(--fg-3); font-weight:600; margin-top:2px; display:flex; flex-wrap:wrap; gap:4px 8px}
.mv-time{font-size:12px; color:var(--fg-3); font-weight:700; flex:none}

/* ============================================================
   CHARTS
   ============================================================ */
.chart-wrap{position:relative}
.chart-wrap svg{display:block; width:100%; height:auto; overflow:visible}
.c-grid{stroke:var(--border); stroke-width:1}
.c-axis{fill:var(--fg-3); font-size:11px; font-weight:600; font-family:var(--ff)}
.c-val{fill:var(--fg); font-size:11.5px; font-weight:800; font-family:var(--ff); font-variant-numeric:tabular-nums}
.c-bar{transition:opacity 140ms var(--ease)}
/* Les barres poussent depuis l'axe. transform-box:fill-box pour que l'origine
   soit celle du rectangle et non celle du SVG entier.                        */
.c-bar rect:not(.c-hit){transform-origin:bottom; transform-box:fill-box;
  animation:pousser 460ms var(--ease) backwards}
@keyframes pousser{from{transform:scaleY(0)}}
@keyframes remplir{from{transform:scaleX(0)}}
.chart-wrap:hover .c-bar{opacity:.45}
.chart-wrap .c-bar:hover{opacity:1}
.c-hit{fill:transparent; cursor:pointer}
.hbar-row{display:grid; grid-template-columns:1fr; gap:5px; padding:9px 0}
.hbar-row + .hbar-row{border-top:1px solid var(--border)}
.hbar-top{display:flex; align-items:center; gap:var(--s2); font-size:13.5px; font-weight:600}
.hbar-top .spacer{flex:1}
.hbar-track{height:9px; border-radius:5px; background:var(--surface-2); border:1px solid var(--border); overflow:hidden}
.hbar-fill{display:block; height:100%; border-radius:5px 3px 3px 5px; background:var(--data);
  transition:width 350ms var(--ease); transform-origin:left; animation:remplir 520ms var(--ease) backwards}
.stack-bar{display:flex; height:26px; border-radius:var(--r-sm); overflow:hidden; gap:2px; background:var(--border)}
.stack-bar i{display:block; height:100%; transform-origin:left; animation:remplir 520ms var(--ease) backwards}
.legend{display:flex; flex-wrap:wrap; gap:var(--s2) var(--s4); margin-top:var(--s3)}
.legend span{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--fg-2)}
.tip{
  position:absolute; z-index:10; pointer-events:none; background:var(--fg); color:#fff;
  padding:7px 10px; border-radius:var(--r-sm); font-size:12.5px; font-weight:600;
  box-shadow:var(--sh-2); white-space:nowrap; transform:translate(-50%,-115%);
}
.tip b{font-weight:800}

table.data{width:100%; border-collapse:collapse; font-size:13px}
table.data th.n{text-align:right}
table.data th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--fg-3); padding:6px 8px; border-bottom:1px solid var(--border)}
table.data td{padding:7px 8px; border-bottom:1px solid var(--border); font-weight:600}
table.data td.n{text-align:right; font-variant-numeric:tabular-nums}
</style>
</head>

<script>
'use strict';
/* ============================================================================
   KITS VSAV — CS Seppois-le-Bas · Service VSAV
   PWA fichier unique. Mode démo : données en localStorage.
   Le branchement Make.com se fait dans l'objet API (tout en bas) — aucune
   autre partie du code ne touche au stockage.
   ============================================================================ */

/* ---------- 1. CONFIGURATION MÉTIER ------------------------------------- */

const ORG = { cs: 'CS Seppois-le-Bas', service: 'Service VSAV' };

/* Logo officiel des Sapeurs-Pompiers du Haut-Rhin. Vide = repli sur la flamme. */
/* Fond photo de l'écran de connexion (voir make-assets.py). Traité en noir et
   blanc puis recouvert d'un voile rouge, comme le portail du SDIS.
   Vide = repli sur le dégradé rouge uni.                                     */
const FOND_CONNEXION = 'fond.jpg';

const LOGO_SDIS = 'logo.png';

/* `hue` = pastille d'identité du type, reprise des couleurs utilisées au CS.
   Elle accompagne toujours le libellé écrit : la couleur ne porte jamais seule
   l'information (deux rouges et deux verts se ressemblent de près).          */
/* L'ordre de ce tableau est l'ordre d'affichage partout : stock, sortie, entrée,
   paramètres, tableau des stats. Les trois kits les plus utilisés en tête.     */
let TYPES = [
  { id:'PERFUSION',    label:'Perfusion',        hue:'#DC2626', dot:4 },  // rouge
  { id:'MEDICAMENT',   label:'Médicament',       hue:'#EAB308', dot:3 },  // jaune
  { id:'INTUBATION',   label:'Intubation',       hue:'#2563EB', dot:2 },  // bleu
  { id:'MEMBRE_SECT',  label:'Membre sectionné', hue:'#16A34A', dot:2 },  // vert
  { id:'BRULURE',      label:'Brûlure',          hue:'#E2541D', dot:3 },  // rouge orangé
  { id:'ACCOUCHEMENT', label:'Accouchement',     hue:'#15803D', dot:2 },  // vert foncé
  { id:'AES',          label:'AES',              hue:'#7C3AED', dot:3 },  // violet
];
let T = Object.fromEntries(TYPES.map(t => [t.id, t]));

const MOTIFS = [
  { id:'INTERVENTION', label:'Utilisé en intervention', short:'Intervention', tone:'info',    color:'#2563EB', needSis:true  },
  { id:'PERIME',       label:'Périmé',                  short:'Périmé',       tone:'crit',    color:'#B91C1C', needSis:false },
  { id:'ERREUR',       label:'Erreur / ouverture',      short:'Erreur',       tone:'warn',    color:'#CA8A04', needSis:false },
  { id:'INUTILE',      label:'Sorti inutilement',       short:'Inutile',      tone:'warn',    color:'#EA580C', needSis:false },
  { id:'CORRECTION',   label:"Correction d'inventaire", short:'Correction',   tone:'neutral', color:'#64748B', needSis:false },
];
const M = Object.fromEntries(MOTIFS.map(m => [m.id, m]));

/** Chefs d'agrès du CS habilités à sortir des kits. */
let CHEFS = [
  'ATA Teva', 'BARRET Steve', 'BIHL Patrice', 'BRESSAC Cedric', 'CASPAR Laurent',
  'DERRIEN Arnaud', 'DEVEILLE Laurent', 'ENDERLEN Didier', 'HARTMANN Sébastien',
  'HIRTZLIN Denis', 'KLEIN Jean-Louis', 'MULLER Laetitia', 'MULLER Raphaël',
  'SCHMITT Guillaume',
  'SOLDERMANN Marc', 'SOLDERMANN Nicolas', 'STRUB Bertrand',
];

/* Uniquement pour le mode démo (configuration Supabase vide). En mode connecté,
   les codes sont des mots de passe de comptes et ceux-ci ne sont jamais lus.   */
const DEFAULTS = {
  alerteJours: 20,
  codeChef: '1818',
  admins: [
    { code:'2601', nom:'MULLER Sacha'   },
    { code:'1507', nom:'DERRIEN Arnaud' },
  ],
};

/* ---------- 2. UTILITAIRES ---------------------------------------------- */

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sansAccent = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function ico(name, size = 20) {
  return `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true" focusable="false"><use href="#i-${name}"/></svg>`;
}

const pad2 = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const fmtDate = iso => { if (!iso) return '—'; const [y,m,d] = iso.slice(0,10).split('-'); return `${d}/${m}/${y}`; };
const fmtTime = iso => new Date(iso).toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
const dayKey  = iso => iso.slice(0, 10);
const monthKey= iso => iso.slice(0, 7);

const MOIS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MOIS_LONG = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const moisCourt = ym => MOIS[+ym.slice(5,7) - 1];
const moisLong  = ym => `${MOIS_LONG[+ym.slice(5,7) - 1]} ${ym.slice(0,4)}`;

function joursRestants(iso) {
  if (!iso) return NaN;
  const a = new Date(iso + 'T00:00:00'), b = new Date(todayISO() + 'T00:00:00');
  return Math.round((a - b) / 86400000);
}
function jourLabel(iso) {
  const t = todayISO();
  if (iso === t) return "Aujourd'hui";
  const h = new Date(t + 'T00:00:00'); h.setDate(h.getDate() - 1);
  if (iso === `${h.getFullYear()}-${pad2(h.getMonth()+1)}-${pad2(h.getDate())}`) return 'Hier';
  return new Date(iso + 'T00:00:00').toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
function haptic(ms = 12) { try { navigator.vibrate?.(ms); } catch {} }

/* ---------- 3. ÉTAT ------------------------------------------------------ */

const KEY = 'vsav_kits_v3';
let S = null;         // état applicatif
let session = null;   // { nom, role:'chef'|'admin' }
let route = 'stock';

function save() {
  if (enLigne()) return;          // la base Supabase fait foi, pas le navigateur
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {}
}

/** État minimal : de quoi afficher l'écran de connexion avant tout chargement. */
function etatVide() {
  return { kits: [], params: { dotation: Object.fromEntries(TYPES.map(t => [t.id, t.dot])),
                               alerteJours: 20, codeChef: '', admins: [] } };
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { S = JSON.parse(raw); return; }
  } catch {}
  S = seed();
  save();
}

/* --- Statut de péremption d'un kit -------------------------------------- */
function perStatus(kit) {
  const j = joursRestants(kit.peremption);
  if (Number.isNaN(j)) return { id:'inconnu', tone:'neutral', label:'Péremption inconnue', detail:'', jours:NaN };
  if (j < 0)  return { id:'perime', tone:'crit', label:'Périmé',  detail:`depuis ${Math.abs(j)} j`, jours:j };
  if (j <= S.params.alerteJours) return { id:'proche', tone:'warn', label:'Bientôt périmé', detail:`dans ${j} j`, jours:j };
  return { id:'ok', tone:'ok', label:'Conforme', detail:`dans ${j} j`, jours:j };
}

/* --- Sélecteurs --------------------------------------------------------- */
const enStock   = () => S.kits.filter(k => k.statut === 'stock');
const stockType = id => enStock().filter(k => k.type === id).sort((a,b) => a.peremption.localeCompare(b.peremption));
const dotation  = id => S.params.dotation[id] ?? 0;

function bilan() {
  const st = enStock();
  const perimes = st.filter(k => perStatus(k).id === 'perime').length;
  const proches = st.filter(k => perStatus(k).id === 'proche').length;
  const manque  = TYPES.reduce((n, t) => n + Math.max(0, dotation(t.id) - stockType(t.id).length), 0);
  return { total: st.length, perimes, proches, manque, cible: TYPES.reduce((n,t)=>n+dotation(t.id), 0) };
}
/** Nombre d'alertes à traiter (badge de nav) */
const nbAlertes = () => { const b = bilan(); return b.perimes + b.manque; };

/** Journal des mouvements, dérivé des kits — pas de doublon de données. */
function mouvements() {
  const out = [];
  for (const k of S.kits) {
    if (!k.horsInventaire) {
      out.push({ id:k.id+'-in', sens:'ENTREE', ts:k.entreLe, type:k.type, numero:k.numero,
                 peremption:k.peremption, par:k.entrePar });
    }
    if (k.statut === 'sorti') {
      out.push({ id:k.id+'-out', sens:'SORTIE', ts:k.sortieLe, type:k.type, numero:k.numero,
                 peremption:k.peremption, par:k.sortiePar, motif:k.motif,
                 intervention:k.intervention, kitId:k.id, horsInventaire:k.horsInventaire,
                 joursStock: k.horsInventaire ? -1
                   : Math.round((new Date(k.sortieLe) - new Date(k.entreLe)) / 86400000) });
    }
  }
  return out.sort((a,b) => b.ts.localeCompare(a.ts));
}

/* ---------- 4. JEU DE DONNÉES DE DÉMONSTRATION -------------------------- */
/* Reproduit les volumes réels observés dans le Google Sheet actuel :
   ~4 à 9 sorties/mois, majorité PERFUSION + MEDICAMENT, quelques péremptions. */
function seed() {
  const rnd = (seed => () => (seed = seed * 16807 % 2147483647) / 2147483647)(20260904);
  const pick = a => a[Math.floor(rnd() * a.length)];
  const chefs = CHEFS;
  const poids = ['PERFUSION','PERFUSION','PERFUSION','MEDICAMENT','MEDICAMENT','MEDICAMENT',
                 'AES','BRULURE','INTUBATION','ACCOUCHEMENT','MEMBRE_SECT'];

  const kits = [];
  let numero = 24100;
  const now = new Date();
  const iso = d => d.toISOString();

  // 15 mois d'historique
  for (let mBack = 15; mBack >= 1; mBack--) {
    const nb = 3 + Math.floor(rnd() * 6);
    for (let i = 0; i < nb; i++) {
      const type = pick(poids);
      const sortie = new Date(now); sortie.setMonth(sortie.getMonth() - mBack);
      sortie.setDate(1 + Math.floor(rnd() * 27));
      sortie.setHours(7 + Math.floor(rnd()*15), Math.floor(rnd()*60), 0, 0);
      const entree = new Date(sortie); entree.setDate(entree.getDate() - (20 + Math.floor(rnd()*250)));

      const r = rnd();
      const motif = r < .70 ? 'INTERVENTION' : r < .86 ? 'PERIME' : r < .93 ? 'ERREUR' : r < .97 ? 'INUTILE' : 'CORRECTION';
      const per = new Date(sortie);
      per.setMonth(per.getMonth() + (motif === 'PERIME' ? -1 - Math.floor(rnd()*2) : 4 + Math.floor(rnd()*20)));

      kits.push({
        id: uid(), type, numero: String(numero += 1 + Math.floor(rnd()*40)),
        peremption: iso(per).slice(0,10),
        entreLe: iso(entree), entrePar: pick(['DERRIEN Arnaud','MULLER Sacha']),
        statut: 'sorti', sortieLe: iso(sortie), sortiePar: pick(chefs), motif,
        intervention: motif === 'INTERVENTION' ? String(19000 + Math.floor(rnd()*9000)) : '',
      });
    }
  }

  // Stock actuellement en place — volontairement imparfait (manques + péremptions)
  const enPlace = { MEDICAMENT:3, PERFUSION:4, MEMBRE_SECT:2, BRULURE:2, ACCOUCHEMENT:2, INTUBATION:1, AES:3 };
  for (const [type, n] of Object.entries(enPlace)) {
    for (let i = 0; i < n; i++) {
      const per = new Date(now);
      const r = rnd();
      // ~10 % périmés, ~20 % bientôt périmés, le reste conforme
      per.setMonth(per.getMonth() + (r < .10 ? -1 : r < .30 ? 1 : 6 + Math.floor(rnd()*24)));
      per.setDate(1 + Math.floor(rnd()*27));
      const entree = new Date(now); entree.setDate(entree.getDate() - (5 + Math.floor(rnd()*300)));
      kits.push({
        id: uid(), type, numero: String(numero += 1 + Math.floor(rnd()*40)),
        peremption: iso(per).slice(0,10),
        entreLe: iso(entree), entrePar: pick(['DERRIEN Arnaud','MULLER Sacha']),
        statut: 'stock',
      });
    }
  }

  return {
    kits,
    params: {
      dotation: Object.fromEntries(TYPES.map(t => [t.id, t.dot])),
      alerteJours: DEFAULTS.alerteJours,
      codeChef: DEFAULTS.codeChef,
      admins: DEFAULTS.admins.map(a => ({ ...a })),
    },
  };
}

let sheetCleanup = null;
function openSheet({ title, body, foot, onMount }) {
  closeSheet();

  wrap.innerHTML = `
    <div class="scrim" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">

  $$('[data-close]', wrap).forEach(b => b.addEventListener('click', closeSheet));
  const onKey = e => { if (e.key === 'Escape') closeSheet(); };
  document.addEventListener('keydown', onKey);
  sheetCleanup = () => { wrap.remove(); document.removeEventListener('keydown', onKey); };
  onMount?.(wrap);
  $('.sheet-body button, .sheet-body input', wrap)?.focus?.({ preventScroll: true });
}
function closeSheet() { sheetCleanup?.(); sheetCleanup = null; }

/** Ordre des écrans : il donne le sens du glissement, pour qu'aller à droite
 *  dans la barre du bas fasse glisser le contenu vers la gauche.            */
const ORDRE_ECRANS = ['stock', 'sortie', 'entree', 'historique', 'stats', 'params'];

const mouvementReduit = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

function go(r) {
  const sens = ORDRE_ECRANS.indexOf(r) >= ORDRE_ECRANS.indexOf(route) ? 'avant' : 'arriere';

  // Rendu à exécution unique : le filet de sécurité plus bas peut l'appeler
  // une deuxième fois sans dessiner l'écran deux fois.
  let fait = false;
  const maj = () => {
    if (fait) return;
    fait = true;
    route = r; render(); window.scrollTo({ top: 0 });
  };

  const anime = document.startViewTransition && !mouvementReduit()
             && document.visibilityState === 'visible';
  if (!anime) { maj(); animerCompteurs(); return; }

  document.documentElement.dataset.sens = sens;
  try {
    const t = document.startViewTransition(maj);
    t.ready.then(animerCompteurs).catch(() => {});
    t.finished.finally(() => delete document.documentElement.dataset.sens);
  } catch { maj(); }

  // Si le navigateur n'appelle jamais le rappel — page passée en arrière-plan
  // au mauvais moment — l'écran resterait figé sur la vue précédente.
  setTimeout(maj, 250);
}

/** Les indicateurs montent jusqu'à leur valeur. Le HTML contient déjà le
 *  chiffre final : sans animation, l'affichage est juste correct.           */
function animerCompteurs() {
  if (mouvementReduit()) return;
  $$('[data-compteur]').forEach(el => {
    const cible = +el.dataset.compteur;
    if (!Number.isFinite(cible) || cible === 0) return;
    let debut = null;
    const pas = t => {
      // On ne remet à zéro qu'une fois la première image obtenue : si l'onglet
      // est en arrière-plan, requestAnimationFrame ne se déclenche pas et le
      // chiffre juste reste affiché au lieu d'un zéro trompeur.
      if (debut === null) { debut = t; el.textContent = '0'; }
      const p = Math.min(1, (t - debut) / 520);
      if (p < 1) {
        el.textContent = Math.round(cible * (1 - Math.pow(1 - p, 3)));   // sortie cubique
        requestAnimationFrame(pas);
      } else {
        el.textContent = cible;                                          // valeur exacte
      }
    };
    requestAnimationFrame(pas);
  });
}

  host.innerHTML = types.map(t => {
    const kits = stockType(t.id);
    const dot = dotation(t.id), n = kits.length;
    const manque = Math.max(0, dot - n);
    const nPer = kits.filter(k => perStatus(k).id === 'perime').length;
    const nProche = kits.filter(k => perStatus(k).id === 'proche').length;
    const pct = dot ? Math.min(100, n / dot * 100) : 100;
    const gClass = n === 0 ? 'none' : manque ? 'low' : '';
    const isOpen = expanded.has(t.id);

    const alertes = [];
    if (manque) alertes.push(`<span class="badge warn">${ico('inbox',12)} ${manque} manquant${manque>1?'s':''}</span>`);
    if (nPer)   alertes.push(`<span class="badge crit">${ico('alert',12)} ${nPer} périmé${nPer>1?'s':''}</span>`);
    if (nProche)alertes.push(`<span class="badge warn">${ico('clock',12)} ${nProche} &lt; ${S.params.alerteJours} j</span>`);
    if (!alertes.length) alertes.push(`<span class="badge ok">${ico('check',12)} Conforme</span>`);

    return `
    <div class="type-card">
      <button class="type-head" data-t="${t.id}" aria-expanded="${isOpen}">
        <span class="dot" style="background:${t.hue}"></span>
        <span style="flex:1;min-width:0">
          <span class="type-name">${t.label}</span>
          <span class="type-meta chips" style="margin-top:4px">${alertes.join('')}</span>
        </span>
        <span class="type-right">
          <span class="type-count num">${n}<small>/${dot}</small></span>
          <span class="gauge ${gClass}"><i style="width:${pct}%"></i></span>
        </span>
        <span class="chev">${ico('chev-r',18)}</span>
      </button>
      ${isOpen ? (kits.length ? kits.map(k => {
        const s = perStatus(k);
        return `<div class="kit-row">
          <span class="kit-no num">n°&nbsp;${esc(k.numero)}</span>
          <span style="flex:1;min-width:0">
            ${badgePer(k)}
            <div class="kit-per">${s.id==='perime'?'Périmé ':'Périme '}${s.detail} · entré le ${fmtDate(k.entreLe)}</div>
          </span>
          <button class="btn btn-sm btn-ghost" data-out="${k.id}">${ico('out',15)} Sortir</button>
        </div>`;
      }).join('') : `<div class="kit-row" style="color:var(--fg-3);font-size:13.5px;font-weight:600">
          ${ico('inbox',16)} Aucun kit de ce type en stock</div>`) : ''}
    </div>`;
  }).join('');

  $$('[data-t]', host).forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.t;
    expanded.has(id) ? expanded.delete(id) : expanded.add(id);
    renderStockList(host);
  }));
  $$('[data-out]', host).forEach(b => b.addEventListener('click', () => {
    const k = S.kits.find(x => x.id === b.dataset.out);
    if (!k) return;
    ajouterAuPanier(k);
    go('sortie');
  }));
}

/* ---------- 9. VUE SORTIE ------------------------------------------------ */
/* Chef d'agrès : scan de l'étiquette, ou saisie du type et du n° à la main.
   Il ne voit jamais l'inventaire — il déclare ce qu'il a utilisé en intervention.
   Admin : sélection depuis le stock, avec tri FEFO.                          */

let panier = [];
let formSortie = { nom:'', sis:'', motif:'INTERVENTION' };
let formManuel = { type:'', numero:'' };

function ajouterAuPanier(kit) {
  if (panier.some(k => k.id === kit.id)) { toast('Ce kit est déjà dans la sortie'); return false; }
  panier.push(kit); haptic(15); return true;
}

/** Noms proposés, selon l'accès utilisé :
 *  – code chef d'agrès : l'effectif du CS (constante CHEFS), liste fermée ;
 *  – code responsable VSAV : les deux responsables uniquement, cet accès ne
 *    servant qu'à eux. « Un autre nom… » reste leur porte de sortie.         */
function listeChefs() {
  const noms = session.role === 'admin' ? S.params.admins.map(a => a.nom) : CHEFS;
  return [...noms].sort((a, b) => a.localeCompare(b, 'fr'));
}

function viewSortie(el) {
  const m = M[formSortie.motif];
  const admin = session.role === 'admin';
  const libelleNom = admin ? 'Responsable VSAV' : "Nom du chef d'agrès";
  if (admin && !formSortie.nom) formSortie.nom = session.nom;

  el.innerHTML = `
    <div class="card pad">
      <div class="field">
        <label class="label" for="f-nom">${libelleNom} <span class="req">*</span></label>
        <button class="inp" id="f-nom" style="display:flex;align-items:center;gap:8px;text-align:left">
          <span style="flex:1;min-width:0;font-weight:${formSortie.nom ? '700' : '400'};
                color:var(--${formSortie.nom ? 'fg' : 'fg-3'});overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
            ${formSortie.nom ? esc(formSortie.nom) : 'Choisir dans la liste'}</span>
          ${ico('chev-d', 18)}
        </button>
        <div class="err" id="e-nom" hidden></div>
      </div>

      <div class="field">
        <label class="label">Motif de la sortie <span class="req">*</span></label>
        <div class="chips" role="group" aria-label="Motif">
          ${MOTIFS.map(x => `<button class="chip" data-m="${x.id}" aria-pressed="${x.id === formSortie.motif}">
             <span class="dot" style="background:${x.color}"></span>${x.short}</button>`).join('')}
        </div>
      </div>

      <div class="field" id="wrap-sis" ${m.needSis ? '' : 'hidden'}>
        <label class="label" for="f-sis">N° d'intervention SIS <span class="req">*</span></label>
        <input class="inp num" id="f-sis" inputmode="numeric" autocomplete="off" enterkeyhint="done"
               placeholder="ex. 19272" value="${esc(formSortie.sis)}">
        <div class="err" id="e-sis" hidden></div>
        <p class="hint">Un seul numéro d'intervention pour tous les kits sortis ci-dessous.</p>
      </div>
    </div>

    <div class="section-title">
      <span>Kits utilisés</span><div class="spacer"></div>
      ${admin ? `<button class="btn btn-sm btn-dark" id="b-scan">${ico('scan',16)} Scanner</button>` : ''}
    </div>

    <div id="panier"></div>

    ${admin ? `
      <div class="section-title">Ajouter depuis le stock</div>
      <div class="type-grid" id="grid-types"></div>`
    : `
      <div class="section-title">Ajouter manuellement</div>
      <div class="card pad" id="manuel"></div>`}

    <div class="stickybar" id="bar" hidden><div class="stickybar-in">
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:800" id="bar-n"></div>
        <div style="font-size:12px;color:var(--fg-3);font-weight:600" id="bar-s"></div>
      </div>
      <button class="btn btn-primary" id="b-valider">${ico('check',18)} Valider la sortie</button>
    </div></div>`;

  $('#f-nom', el).addEventListener('click', () => choisirChef(el));
  $('#f-sis', el).addEventListener('input', e => {
    formSortie.sis = e.target.value.replace(/[^\dA-Za-z\/-]/g, ''); e.target.value = formSortie.sis;
  });
  $$('[data-m]', el).forEach(b => b.addEventListener('click', () => {
    formSortie.motif = b.dataset.m; haptic(); viewSortie(el);
  }));
  $('#b-scan', el)?.addEventListener('click', () => scannerPourSortie(el));
  $('#b-valider', el).addEventListener('click', () => validerSortie(el));

  renderPanier(el);
  if (admin) renderGrilleTypes(el); else renderManuel(el);
  majBarre();
}

/* --- Choix du chef d'agrès dans l'effectif ------------------------------- */
function choisirChef(el) {
  const noms = listeChefs();
  openSheet({
    title: session.role === 'admin' ? 'Responsable VSAV' : "Chef d'agrès",
    body: `<div id="ch-liste">${noms.map(nom => `
      <button class="picker-item" data-nom="${esc(nom)}" style="min-height:52px">
        <span class="mv-ic in" style="background:var(--surface-2);color:var(--fg-3)">${ico('user',16)}</span>
        <span style="flex:1;font-weight:700">${esc(nom)}</span>
        ${nom === formSortie.nom ? `<span style="color:var(--ok)">${ico('check',18)}</span>` : ''}
      </button>`).join('')}
      ${session.role === 'admin' ? `
      <button class="picker-item" id="ch-autre" style="min-height:52px;border-style:dashed">
        <span class="mv-ic in" style="background:var(--surface-2);color:var(--fg-3)">${ico('plus',16)}</span>
        <span style="flex:1;font-weight:700;color:var(--fg-2)">Un autre nom…</span>
      </button>` : ''}</div>`,
    onMount: w => {
      $$('[data-nom]', w).forEach(b => b.addEventListener('click', () => {
        formSortie.nom = b.dataset.nom; haptic(); closeSheet(); viewSortie(el);
      }));
      $('#ch-autre', w)?.addEventListener('click', () => {
        $('#ch-liste', w).innerHTML = `
          <label class="label" for="ch-libre">Nom du chef d'agrès</label>
          <input class="inp" id="ch-libre" placeholder="NOM Prénom" autocomplete="off" enterkeyhint="done">
          <p class="hint">À n'utiliser que si le nom ne figure pas dans la liste.</p>
          <button class="btn btn-dark btn-block" id="ch-ok" style="margin-top:12px">${ico('check',18)} Valider</button>`;
        const inp = $('#ch-libre', w);
        const ok = () => {
          const v = inp.value.trim();
          if (v.length < 3) { toast('Nom trop court', 'err'); return; }
          formSortie.nom = v; closeSheet(); viewSortie(el);
        };
        $('#ch-ok', w).addEventListener('click', ok);
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
        inp.focus();
      });
    },
  });
}

/* --- Panier ------------------------------------------------------------- */
function renderPanier(el) {
  const host = $('#panier', el);
  if (!panier.length) {
    host.innerHTML = `<div class="empty card">${ico('out',36)}
      <strong>Aucun kit sélectionné</strong>
      <p>${session.role === 'admin'
        ? "Scannez l'étiquette du kit utilisé, ou choisissez un type ci-dessous."
        : 'Choisissez le type de kit et saisissez son numéro ci-dessous.'}<br>
      Vous pouvez déclarer plusieurs kits en une seule fois.</p></div>`;
    return;
  }
  host.innerHTML = panier.map(k => {
    const t = T[k.type];
    return `<div class="cart-item">
      <span class="dot" style="background:${t.hue}"></span>
      <span style="flex:1;min-width:0">
        <div style="font-size:14.5px;font-weight:700">${t.label} · <span class="num">n° ${esc(k.numero)}</span></div>
        <div style="font-size:12.5px;color:var(--fg-3);font-weight:600;display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:2px">
          ${k.peremption ? `<span>Péremption ${fmtDate(k.peremption)}</span>` : ''}
          ${k.horsInventaire ? `<span class="badge crit" style="font-size:10.5px">${ico('alert',11)} Hors inventaire</span>` : ''}
        </div>
      </span>
      <button class="icon-btn dark" data-rm="${k.id}" aria-label="Retirer ce kit de la sortie">${ico('trash',18)}</button>
    </div>`;
  }).join('');
  $$('[data-rm]', host).forEach(b => b.addEventListener('click', () => {
    panier = panier.filter(k => k.id !== b.dataset.rm);
    renderPanier(el);
    if (session.role === 'admin') renderGrilleTypes(el); else renderManuel(el);
    majBarre();
  }));
}

/* --- Scan (les deux rôles) ---------------------------------------------- */
function scannerPourSortie(el) {
  ouvrirScanner({
    titre: 'Scanner un kit utilisé',
    onResult: r => {
      if (!r.numero) { toast("Numéro de kit illisible sur ce code", 'err'); return false; }
      const kit = enStock().find(k => k.numero === r.numero);
      if (kit) {
        if (!ajouterAuPanier(kit)) return true;
        toast(`${T[kit.type].label} n° ${kit.numero} ajouté`, 'ok');
        viewSortie(el); return true;
      }
      // Numéro absent de l'inventaire : on l'accepte mais on le signale.
      const type = r.type || formManuel.type;
      if (!type) {
        toast(session.role === 'admin'
          ? `Kit n° ${r.numero} introuvable en stock`
          : `Kit n° ${r.numero} inconnu — ajoutez-le à la main ci-dessous`, 'err');
        return false;
      }
      ajouterHorsInventaire(type, r.numero, r.peremption, el);
      return true;
    },
  });
}

/* --- Saisie à la main (chef d'agrès) ------------------------------------ */
function renderManuel(el) {
  const host = $('#manuel', el); if (!host) return;
  host.innerHTML = `
    <div class="field">
      <label class="label">Type de kit <span class="req">*</span></label>
      <div class="type-grid" id="m-types">
        ${TYPES.map(t => `<button class="type-pick" data-mt="${t.id}" aria-pressed="${formManuel.type === t.id}"
            style="min-height:56px;justify-content:center">
          <span class="row" style="gap:7px;width:100%">
            <span class="dot" style="background:${t.hue}"></span><span style="flex:1">${t.label}</span>
          </span></button>`).join('')}
      </div>
      <div class="err" id="e-mtype" hidden></div>
    </div>
    <div class="field">
      <label class="label" for="m-num">Numéro du kit <span class="req">*</span></label>
      <input class="inp num" id="m-num" inputmode="numeric" autocomplete="off" enterkeyhint="done"
             placeholder="ex. 25781" value="${esc(formManuel.numero)}">
      <div class="err" id="e-mnum" hidden></div>
      <p class="hint">Le numéro imprimé sur l'étiquette, au-dessus de la date de péremption.</p>
    </div>
    <button class="btn btn-ghost btn-block" id="m-ok">${ico('plus',18)} Ajouter ce kit</button>`;

  $$('[data-mt]', host).forEach(b => b.addEventListener('click', () => {
    formManuel.type = b.dataset.mt; haptic(); renderManuel(el); $('#m-num', el).focus();
  }));
  const inp = $('#m-num', host);
  inp.addEventListener('input', e => {
    formManuel.numero = e.target.value.replace(/[^\dA-Za-z\/-]/g, ''); e.target.value = formManuel.numero;
  });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') ajouterManuel(el); });
  $('#m-ok', host).addEventListener('click', () => ajouterManuel(el));
}

function ajouterManuel(el) {
  let ok = true;
  const setErr = (id, msg) => {
    const e = $('#e-' + id); if (!e) return;
    if (msg) { e.innerHTML = ico('alert',14) + ' ' + msg; e.hidden = false; ok = false; } else e.hidden = true;
  };
  setErr('mtype', formManuel.type ? '' : 'Choisissez le type de kit');
  setErr('mnum',  formManuel.numero.trim() ? '' : 'Saisissez le numéro du kit');
  if (!ok) { haptic([30,50,30]); return; }

  const type = formManuel.type, num = formManuel.numero.trim();
  const reset = () => { formManuel.numero = ''; renderManuel(el); $('#m-num', el).focus(); };

  const memeType = enStock().find(k => k.numero === num && k.type === type);
  if (memeType) {
    if (ajouterAuPanier(memeType)) toast(`${T[type].label} n° ${num} ajouté`, 'ok');
    renderPanier(el); reset(); majBarre(); return;
  }

  const autreType = enStock().find(k => k.numero === num);
  if (autreType) {
    confirmer({
      title: 'Type différent',
      message: `Le kit n° <b>${esc(num)}</b> est enregistré en stock comme
                <b>${T[autreType.type].label}</b>, pas comme ${T[type].label}.<br>
                Utiliser le kit enregistré ?`,
      ok: 'Utiliser ' + T[autreType.type].label,
    }, () => {
      ajouterAuPanier(autreType); renderPanier(el); reset(); majBarre();
    });
    return;
  }

  confirmer({
    title: 'Kit absent de l\'inventaire', danger: true, ok: 'Déclarer quand même',
    message: `Aucun kit <b>${T[type].label} n° ${esc(num)}</b> n'est enregistré en stock.<br>
              La sortie sera enregistrée et signalée comme <b>hors inventaire</b> aux responsables VSAV.`,
  }, () => { ajouterHorsInventaire(type, num, '', el); reset(); });
}

/** Kit déclaré alors qu'il n'est pas dans l'inventaire : accepté mais signalé. */
function ajouterHorsInventaire(type, numero, peremption, el) {
  if (panier.some(k => k.numero === numero && k.type === type)) {
    toast('Ce kit est déjà dans la sortie'); return;
  }
  panier.push({ id: 'hors-' + uid(), type, numero, peremption: peremption || '', horsInventaire: true });
  haptic(15);
  toast(`${T[type].label} n° ${numero} déclaré hors inventaire`);
  renderPanier(el); majBarre();
}

/* --- Sélection depuis le stock (admin) ---------------------------------- */
function renderGrilleTypes(el) {
  const host = $('#grid-types', el); if (!host) return;
  host.innerHTML = TYPES.map(t => {
    const dispo = stockType(t.id).filter(k => !panier.some(p => p.id === k.id));
    const urgent = dispo.filter(k => perStatus(k).id !== 'ok').length;
    return `<button class="type-pick" data-pick="${t.id}" ${dispo.length ? '' : 'disabled'}>
      <span class="row" style="gap:6px;width:100%">
        <span class="dot" style="background:${t.hue}"></span>
        <span style="flex:1">${t.label}</span>
      </span>
      <span class="tp-sub">${dispo.length ? `${dispo.length} dispo${urgent ? ` · ${urgent} à sortir en priorité` : ''}` : 'Aucun en stock'}</span>
    </button>`;
  }).join('');
  $$('[data-pick]', host).forEach(b => b.addEventListener('click', () => choisirKit(b.dataset.pick, el)));
}

/** Sélecteur de n° de kit — trié FEFO (péremption la plus proche en premier). */
function choisirKit(typeId, el) {
  const t = T[typeId];
  const dispo = stockType(typeId).filter(k => !panier.some(p => p.id === k.id));
  openSheet({
    title: `${t.label} — choisir le n° de kit`,
    body: dispo.map((k, i) => {
      const s = perStatus(k);
      return `<button class="picker-item" data-k="${k.id}">
        <span style="flex:1;min-width:0">
          <div class="row" style="gap:8px">
            <span class="kit-no num" style="font-size:16px">n° ${esc(k.numero)}</span>
            ${i === 0 ? `<span class="fefo">${ico('bolt',12)} À sortir en 1er</span>` : ''}
          </div>
          <div style="margin-top:5px">${badgePer(k)}</div>
        </span>
        ${ico('chev-r',18)}
      </button>`;
    }).join('') || `<div class="empty">${ico('inbox',34)}<strong>Aucun kit disponible</strong>
        <p>Tous les kits de ce type sont déjà dans la sortie en cours.</p></div>`,
    foot: `<p class="hint" style="margin:0">${ico('info',13)} Les kits sont triés par date de péremption : sortez toujours le premier de la liste.</p>`,
    onMount: w => $$('[data-k]', w).forEach(b => b.addEventListener('click', () => {
      const kit = S.kits.find(x => x.id === b.dataset.k);
      ajouterAuPanier(kit); closeSheet();
      renderPanier(el); renderGrilleTypes(el); majBarre();
    })),
  });
}

/* --- Barre d'action et validation --------------------------------------- */
function majBarre() {
  const bar = $('#bar'); if (!bar) return;
  bar.hidden = panier.length === 0;
  document.documentElement.style.setProperty('--bar-h', panier.length ? '76px' : '0px');
  if (!panier.length) return;
  const parType = {};
  panier.forEach(k => parType[k.type] = (parType[k.type] || 0) + 1);
  $('#bar-n').textContent = `${panier.length} kit${panier.length > 1 ? 's' : ''} à sortir`;
  $('#bar-s').textContent = Object.entries(parType).map(([t, n]) => `${T[t].label}${n > 1 ? ` ×${n}` : ''}`).join(' · ');
}

function validerSortie(el) {
  const m = M[formSortie.motif];
  let ok = true;
  const setErr = (id, msg) => {
    const e = $('#e-' + id), i = $('#f-' + id);
    if (msg) { e.innerHTML = ico('alert',14) + ' ' + msg; e.hidden = false; i.setAttribute('aria-invalid','true'); ok = false; }
    else { e.hidden = true; i.removeAttribute('aria-invalid'); }
  };
  setErr('nom', formSortie.nom.trim().length < 3
    ? (session.role === 'admin' ? 'Indiquez le responsable VSAV' : "Indiquez le nom du chef d'agrès")
    : '');
  if (m.needSis) setErr('sis', formSortie.sis.trim() ? '' : "Le n° d'intervention SIS est obligatoire");
  if (!ok) { $('[aria-invalid="true"]', el)?.focus(); haptic([30,50,30]); return; }
  if (!panier.length) { toast('Sélectionnez au moins un kit', 'err'); return; }

  const btn = $('#b-valider');
  btn.disabled = true; btn.innerHTML = ico('refresh',18) + ' Enregistrement…';

  API.sortie({
    lignes: panier.map(k => ({ id: k.horsInventaire ? null : k.id, type: k.type,
                               numero: k.numero, peremption: k.peremption || '' })),
    nom: formSortie.nom.trim(),
    motif: formSortie.motif,
    intervention: m.needSis ? formSortie.sis.trim() : '',
  }).then(res => {
    const n = res?.n ?? panier.length;
    // Le nom du chef est remis à zéro après chaque validation : sur un téléphone
    // partagé, garder le nom précédent fausserait la sortie suivante.
    panier = []; formManuel = { type:'', numero:'' };
    formSortie = { nom: session.role === 'admin' ? session.nom : '', sis:'', motif:'INTERVENTION' };
    haptic([15, 40, 15]);
    if (n) toast(`${n} kit${n > 1 ? 's' : ''} sorti${n > 1 ? 's' : ''} du stock`, 'ok');
    if (res?.dejaSortis) {
      const d = res.dejaSortis;
      toast(`${d} kit${d > 1 ? 's' : ''} déjà sorti${d > 1 ? 's' : ''} par quelqu'un d'autre`, 'err');
    }
    render();
  }).catch(e => {
    btn.disabled = false; btn.innerHTML = ico('check',18) + ' Valider la sortie';
    toast(e.message || "Erreur lors de l'enregistrement", 'err');
  });
}

/* ---------- 10. VUE ENTRÉE EN STOCK (admin) ----------------------------- */
/* L'étiquette porte les trois informations (n°, péremption, type) : le scan est
   le chemin principal, la saisie manuelle reste le secours.                  */

let formEntree = { type:'', numero:'', peremption:'' };
let ajoutsSession = [];

function viewEntree(el) {
  el.innerHTML = `
    <div class="card pad" style="background:linear-gradient(160deg,#0F172A,#1E293B);border:0">
      <div class="row" style="gap:12px;align-items:flex-start">
        <span style="width:44px;height:44px;border-radius:12px;background:#ffffff1f;color:#fff;
              display:grid;place-items:center;flex:none">${ico('scan',24)}</span>
        <div style="flex:1;min-width:0;color:#fff">
          <div style="font-size:16px;font-weight:800;letter-spacing:-.01em">Scanner l'étiquette</div>
          <div style="font-size:13px;color:#ffffffb8;font-weight:500;margin-top:2px;line-height:1.45">
