/* --- Scan puis confirmation --------------------------------------------- */
function scannerPourEntree(el) {
  ouvrirScanner({
    titre: "Scanner l'étiquette du kit",
    onResult: r => { confirmerEtiquette(r, el); return true; },
  });
}

/** Écran de contrôle après lecture : rien n'entre en stock sans validation. */
function confirmerEtiquette(r, el) {
  const lu = { type: r.type || '', numero: r.numero || '', peremption: r.peremption || '' };
  const complet = lu.type && lu.numero && lu.peremption;
  const manquants = [!lu.type && 'le type', !lu.numero && 'le numéro', !lu.peremption && 'la date de péremption']
                      .filter(Boolean);

  openSheet({
    title: complet ? 'Étiquette lue' : 'Lecture incomplète',
    body: `
      ${complet
        ? `<div class="badge ok" style="margin-bottom:14px">${ico('check-circle',13)} Les trois informations ont été lues</div>`
        : `<div class="badge warn" style="margin-bottom:14px">${ico('alert',13)} Complétez ${manquants.join(' et ')}</div>`}

      <div class="field">
        <label class="label" for="c-type">Type de kit <span class="req">*</span></label>
        <select class="inp" id="c-type">
          <option value="">— à choisir —</option>
          ${TYPES.map(t => `<option value="${t.id}" ${t.id === lu.type ? 'selected' : ''}>${t.label}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label class="label" for="c-num">Numéro du kit <span class="req">*</span></label>
        <input class="inp num" id="c-num" inputmode="numeric" autocomplete="off"
               placeholder="ex. 25731" value="${esc(lu.numero)}">
      </div>
      <div class="field">
        <label class="label" for="c-per">Date de péremption <span class="req">*</span></label>
        <input class="inp" id="c-per" type="date" value="${esc(lu.peremption)}">
        <div id="c-alerte"></div>
      </div>

      <details style="margin-top:4px">
        <summary style="font-size:12.5px;font-weight:700;color:var(--fg-3);cursor:pointer;min-height:32px;
                 display:flex;align-items:center;gap:6px">${ico('info',14)} Code lu par le scanner</summary>
        <div style="margin-top:8px;padding:10px;background:var(--surface-2);border:1px solid var(--border);
             border-radius:var(--r-sm);font-size:12px;word-break:break-all;color:var(--fg-2)">${esc(r.raw)}</div>
        <p class="hint">Si le décodage tombe à côté, envoyez cette chaîne à SL Agence pour caler la lecture.</p>
      </details>`,
    foot: `<div class="row" style="gap:8px">
             <button class="btn btn-ghost" style="flex:1" data-close>Annuler</button>
             <button class="btn btn-primary" style="flex:1.3" id="c-ok">${ico('plus',18)} Ajouter</button>
           </div>`,
    onMount: w => {
      const maj = () => {
        const v = $('#c-per', w).value;
        const zone = $('#c-alerte', w);
        if (!v) { zone.innerHTML = ''; return; }
        const s = perStatus({ peremption: v });
        zone.innerHTML = `<div style="margin-top:8px"><span class="badge ${s.tone}">
          ${ico(s.id === 'perime' ? 'alert' : s.id === 'proche' ? 'clock' : 'check-circle', 13)}
          ${s.label}${s.detail ? ' · ' + s.detail : ''}</span></div>`;
      };
      $('#c-per', w).addEventListener('change', maj); maj();

      $('#c-ok', w).addEventListener('click', () => {
        const type = $('#c-type', w).value;
        const numero = $('#c-num', w).value.trim();
        const peremption = $('#c-per', w).value;
        if (!type || !numero || !peremption) { toast('Complétez les trois champs', 'err'); haptic([30,50,30]); return; }
        formEntree = { type, numero, peremption };
        closeSheet();
        ajouterKit(el, { enchainer: true });
      });
    },
  });
}

function ajouterKit(el, opts = {}) {
  let ok = true;
  const setErr = (id, msg) => {
    const e = $('#e-' + id); if (!e) { if (msg) ok = false; return; }
    if (msg) { e.innerHTML = ico('alert',14) + ' ' + msg; e.hidden = false; ok = false; }
    else e.hidden = true;
  };
  setErr('type',   formEntree.type ? '' : 'Choisissez le type de kit');
  setErr('numero', formEntree.numero.trim() ? '' : 'Saisissez ou scannez le numéro du kit');
  setErr('per',    formEntree.peremption ? '' : 'Saisissez la date de péremption');
  if (!ok) { haptic([30,50,30]); return; }

  const doublon = enStock().find(k => k.numero === formEntree.numero.trim());
  const finaliser = () => {
    const snapshot = { ...formEntree, numero: formEntree.numero.trim() };
    API.entree({ ...snapshot, par: session.nom }).then(kit => {
      ajoutsSession.unshift(kit);
      const per = perStatus(kit);
      formEntree = { type: snapshot.type, numero:'', peremption:'' };   // le type reste : saisie en série
      haptic([15,40,15]);
      toast(`${T[kit.type].label} n° ${kit.numero} ajouté`, 'ok');
      if (per.id === 'perime') toast('Attention : ce kit est déjà périmé', 'err');
      viewEntree(el);
      if (opts.enchainer) proposerSuivant(el);
      else $('#f-numero', el).focus();
    }).catch(e => toast(e.message || 'Erreur', 'err'));
  };

  if (doublon) {
    confirmer({
      title: 'Numéro déjà en stock',
      message: `Le kit n° <b>${esc(doublon.numero)}</b> (${T[doublon.type].label}, péremption ${fmtDate(doublon.peremption)})
                est déjà enregistré en stock. Voulez-vous quand même l'ajouter ?`,
      danger: true, ok: 'Ajouter quand même',
    }, finaliser);
    return;
  }
  finaliser();
}

/** Réappro en série : on enchaîne les étiquettes sans repasser par le menu. */
function proposerSuivant(el) {
  const bandeau = document.createElement('div');
  bandeau.className = 'stickybar';
  bandeau.innerHTML = `<div class="stickybar-in">
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:800">${ajoutsSession.length} kit${ajoutsSession.length > 1 ? 's' : ''} ajouté${ajoutsSession.length > 1 ? 's' : ''}</div>
        <div style="font-size:12px;color:var(--fg-3);font-weight:600">Enchaînez avec l'étiquette suivante</div>
      </div>
      <button class="btn btn-dark" id="sv-scan">${ico('scan',18)} Kit suivant</button>
      <button class="icon-btn dark" id="sv-fin" aria-label="Terminer la série">${ico('x',20)}</button>
    </div>`;
  $('#overlay').appendChild(bandeau);
  document.documentElement.style.setProperty('--bar-h', '76px');
  const fermer = () => { bandeau.remove(); document.documentElement.style.setProperty('--bar-h', '0px'); };
  $('#sv-fin', bandeau).addEventListener('click', fermer);
  $('#sv-scan', bandeau).addEventListener('click', () => { fermer(); scannerPourEntree(el); });
}

function renderRecap(el) {
  const host = $('#recap', el);
  if (!ajoutsSession.length) { host.innerHTML = ''; return; }
  host.innerHTML = `
    <div class="section-title"><span>Ajoutés à l'instant</span><div class="spacer"></div>
      <span class="badge neutral num">${ajoutsSession.length}</span></div>
    <div class="card">${ajoutsSession.map(k => {
      const t = T[k.type];
      return `<div class="kit-row" style="background:var(--surface)">
        <span class="dot" style="background:${t.hue}"></span>
        <span style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:700">${t.label} · <span class="num">n° ${esc(k.numero)}</span></div>
          <div class="kit-per">Péremption ${fmtDate(k.peremption)}</div>
        </span>
        ${badgePer(k)}
        <button class="icon-btn dark" data-undo="${k.id}" aria-label="Annuler cet ajout">${ico('trash',17)}</button>
      </div>`;
    }).join('')}</div>`;
  $$('[data-undo]', host).forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.undo;
    confirmer({ title:'Annuler cet ajout ?', message:'Le kit sera retiré du stock et de l\'historique.', danger:true, ok:'Annuler l\'ajout' },
      () => { API.supprimerKit(id).then(() => { ajoutsSession = ajoutsSession.filter(k => k.id !== id); toast('Ajout annulé'); viewEntree(el); }); });
  }));
}

/* ---------- 11. VUE HISTORIQUE (admin) ---------------------------------- */

let histF = { periode:'90', sens:'tous', type:'tous', q:'' };

function filtrerMouvements() {
  let mv = mouvements();
  if (histF.periode !== 'tout') {
    const lim = new Date(); lim.setDate(lim.getDate() - +histF.periode);
    mv = mv.filter(m => new Date(m.ts) >= lim);
  }
  if (histF.sens !== 'tous') mv = mv.filter(m => m.sens === histF.sens);
  if (histF.type !== 'tous') mv = mv.filter(m => m.type === histF.type);
  const q = histF.q.trim().toLowerCase();
  if (q) mv = mv.filter(m => (m.numero + ' ' + m.par + ' ' + (m.intervention || '')).toLowerCase().includes(q));
  return mv;
}

function viewHistorique(el) {
  el.innerHTML = `
    <div class="card pad" style="padding:var(--s3)">
      <div class="inp-group" style="margin-bottom:var(--s2)">
        <input class="inp" id="h-q" type="search" placeholder="N° de kit, intervention, nom…" value="${esc(histF.q)}">
        <button class="btn btn-soft" id="h-export" style="padding:0 14px" aria-label="Exporter en CSV">${ico('download',18)}</button>
      </div>
      <div class="seg" role="group" aria-label="Période" style="margin-bottom:var(--s2)">
        ${[['30','30 j'],['90','3 mois'],['365','12 mois'],['tout','Tout']].map(([id,l]) =>
          `<button data-p="${id}" aria-pressed="${histF.periode===id}">${l}</button>`).join('')}
      </div>
      <div class="chips">
        ${[['tous','Tous les mouvements'],['SORTIE','Sorties'],['ENTREE','Entrées']].map(([id,l]) =>
          `<button class="chip" data-s="${id}" aria-pressed="${histF.sens===id}">${l}</button>`).join('')}
        <button class="chip" id="h-type" aria-pressed="${histF.type!=='tous'}">
          ${histF.type === 'tous' ? ico('filter',14) + ' Tous les types'
            : `<span class="dot" style="background:${T[histF.type].hue}"></span>${T[histF.type].label}`}
        </button>
      </div>
    </div>
    <div id="h-list"></div>`;

  let deb;
  $('#h-q', el).addEventListener('input', e => {
    clearTimeout(deb); const v = e.target.value;
    deb = setTimeout(() => { histF.q = v; renderHistList($('#h-list', el)); }, 220);
  });
  $$('[data-p]', el).forEach(b => b.addEventListener('click', () => { histF.periode = b.dataset.p; viewHistorique(el); }));
  $$('[data-s]', el).forEach(b => b.addEventListener('click', () => { histF.sens = b.dataset.s; viewHistorique(el); }));
  $('#h-type', el).addEventListener('click', () => openSheet({
    title: 'Filtrer par type de kit',
    body: `<div class="stack">
      <button class="picker-item" data-ht="tous"><span style="flex:1">Tous les types</span>${ico('chev-r',18)}</button>
      ${TYPES.map(t => `<button class="picker-item" data-ht="${t.id}">
        <span class="dot" style="background:${t.hue}"></span><span style="flex:1">${t.label}</span>${ico('chev-r',18)}</button>`).join('')}
    </div>`,
    onMount: w => $$('[data-ht]', w).forEach(b => b.addEventListener('click', () => {
      histF.type = b.dataset.ht; closeSheet(); viewHistorique(el);
    })),
  }));
  $('#h-export', el).addEventListener('click', exportCSV);
  renderHistList($('#h-list', el));
}

function renderHistList(host) {
  const mv = filtrerMouvements();
  if (!mv.length) {
    host.innerHTML = `<div class="empty card">${ico('search',38)}
      <strong>Aucun mouvement</strong><p>Aucun résultat pour ces filtres.</p></div>`;
    return;
  }
  const jours = {};
  mv.slice(0, 400).forEach(m => (jours[dayKey(m.ts)] ||= []).push(m));

  host.className = 'cascade';
  host.innerHTML = `<p class="hint" style="margin:12px 2px 0">${mv.length} mouvement${mv.length>1?'s':''}${mv.length>400?' · 400 affichés':''}</p>`
  + Object.entries(jours).map(([j, list]) => `
    <div class="day-head"><h4>${jourLabel(j)}</h4><span>${list.length} mvt${list.length>1?'s':''}</span></div>
    <div class="card list">${list.map(m => {
      const t = T[m.type], mo = m.motif ? M[m.motif] : null;
      const sortie = m.sens === 'SORTIE';
      return `<div class="mv">
        <span class="mv-ic ${sortie ? 'out' : 'in'}">${ico(sortie ? 'out' : 'in', 17)}</span>
        <span class="mv-main">
          <div class="mv-t"><span class="dot" style="background:${t.hue};display:inline-block;margin-right:6px"></span>${t.label} · <span class="num">n° ${esc(m.numero)}</span></div>
          <div class="mv-s">
            <span>${ico('user',12)} ${esc(m.par)}</span>
            ${mo ? `<span style="color:${mo.color};font-weight:700">${mo.short}</span>` : '<span style="color:var(--ok);font-weight:700">Entrée en stock</span>'}
            ${m.horsInventaire ? `<span class="badge crit" style="font-size:10.5px">${ico('alert',11)} Hors inventaire</span>` : ''}
            ${m.intervention ? `<span>${ico('bolt',12)} SIS ${esc(m.intervention)}</span>` : ''}
            ${sortie && m.joursStock >= 0 ? `<span>${ico('clock',12)} ${m.joursStock} j en stock</span>` : ''}
            ${m.peremption ? `<span>${ico('calendar',12)} pér. ${fmtDate(m.peremption)}</span>` : ''}
          </div>
        </span>
        <span class="mv-time num">${fmtTime(m.ts)}</span>
      </div>`;
    }).join('')}</div>`).join('');
}

function exportCSV() {
  const mv = filtrerMouvements();
  const sep = ';';
  const lignes = [['Horodateur','Sens','Nom','Type de KIT','Numéro du KIT','Date de péremption','Motif','N° intervention SIS','Jours en stock','Hors inventaire'].join(sep)];
  mv.forEach(m => lignes.push([
    new Date(m.ts).toLocaleString('fr-FR'), m.sens, m.par, T[m.type].label, m.numero,
    fmtDate(m.peremption), m.motif ? M[m.motif].label : '', m.intervention || '',
    m.sens === 'SORTIE' && m.joursStock >= 0 ? m.joursStock : '',
    m.horsInventaire ? 'OUI' : '',
  ].map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(sep)));

  const blob = new Blob(['﻿' + lignes.join('\r\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `kits-vsav-${todayISO()}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
  toast(`${mv.length} mouvements exportés`, 'ok');
}

/* ---------- 12. VUE STATISTIQUES (admin) -------------------------------- */

let statsMois = 12;

function derniersMois(n) {
  const out = []; const d = new Date(); d.setDate(1);
  for (let i = n - 1; i >= 0; i--) {
    const x = new Date(d); x.setMonth(x.getMonth() - i);
    out.push(`${x.getFullYear()}-${pad2(x.getMonth() + 1)}`);
  }
  return out;
}

function viewStats(el) {
  const mois = derniersMois(statsMois);
  const debut = mois[0] + '-01';
  const sorties = mouvements().filter(m => m.sens === 'SORTIE' && m.ts.slice(0,10) >= debut);

  const parMois  = Object.fromEntries(mois.map(m => [m, 0]));
  const parType  = Object.fromEntries(TYPES.map(t => [t.id, 0]));
  const parMotif = Object.fromEntries(MOTIFS.map(m => [m.id, 0]));
  let sommeJours = 0, nJours = 0;
  sorties.forEach(m => {
    const k = monthKey(m.ts); if (k in parMois) parMois[k]++;
    parType[m.type]++; parMotif[m.motif]++;
    if (m.joursStock >= 0) { sommeJours += m.joursStock; nJours++; }
  });

  const nbInter  = parMotif.INTERVENTION;
  const nbPerime = parMotif.PERIME;
  const total    = sorties.length;
  const tauxPer  = total ? Math.round(nbPerime / total * 100) : 0;
  const moyMois  = (total / statsMois).toFixed(1).replace('.', ',');
  const dureeMoy = nJours ? Math.round(sommeJours / nJours) : 0;

  const st = enStock();
  const cptPer = { ok:0, proche:0, perime:0 };
  st.forEach(k => cptPer[perStatus(k).id]++);

  el.innerHTML = `
    <div class="seg" role="group" aria-label="Période d'analyse" style="margin-bottom:var(--s3)">
      ${[[6,'6 mois'],[12,'12 mois'],[24,'24 mois']].map(([n,l]) =>
        `<button data-sm="${n}" aria-pressed="${statsMois===n}">${l}</button>`).join('')}
    </div>

    <div class="kpis">
      <div class="kpi"><div class="k-label">${ico('out',13)} Sorties</div>
        <div class="k-val num" data-compteur="${total}">${total}</div><div class="k-sub">${moyMois} / mois en moyenne</div></div>
      <div class="kpi is-ok"><div class="k-label">${ico('bolt',13)} Interventions</div>
        <div class="k-val num" data-compteur="${nbInter}">${nbInter}</div><div class="k-sub">${total ? Math.round(nbInter/total*100) : 0} % des sorties</div></div>
      <div class="kpi ${tauxPer > 15 ? 'is-crit' : 'is-warn'}"><div class="k-label">${ico('alert',13)} Périmés</div>
        <div class="k-val num" data-compteur="${nbPerime}">${nbPerime}</div><div class="k-sub">${tauxPer} % de perte</div></div>
      <div class="kpi"><div class="k-label">${ico('clock',13)} Rotation</div>
        <div class="k-val num"><span data-compteur="${dureeMoy}">${dureeMoy}</span><span style="font-size:15px;color:var(--fg-3)"> j</span></div>
        <div class="k-sub">durée moyenne en stock</div></div>
    </div>

    <div class="section-title">Consommation mensuelle</div>
    <div class="card pad"><div class="chart-wrap" id="ch-mois"></div>
      <p class="hint" style="margin-top:10px">Nombre de kits sortis du stock, tous motifs confondus.</p></div>

    <div class="section-title">Consommation par type de kit</div>
    <div class="card pad" id="ch-type"></div>

    <div class="section-title">Motifs de sortie</div>
    <div class="card pad" id="ch-motif"></div>

    <div class="section-title">Péremption du stock actuel</div>
    <div class="card pad" id="ch-per"></div>

    <div class="section-title">Détail par type</div>
    <div class="card pad" style="overflow-x:auto"><table class="data">
      <thead><tr><th>Type</th><th class="n">Sorties</th><th class="n">En stock</th><th class="n">Dotation</th><th class="n">Écart</th></tr></thead>
      <tbody>${TYPES.map(t => {
        const n = stockType(t.id).length, d = dotation(t.id), e = n - d;
        return `<tr>
          <td><span class="dot" style="background:${t.hue};display:inline-block;margin-right:7px"></span>${t.label}</td>
          <td class="n">${parType[t.id]}</td><td class="n">${n}</td><td class="n">${d}</td>
          <td class="n" style="color:${e < 0 ? 'var(--crit)' : e > 0 ? 'var(--fg-3)' : 'var(--ok)'}">${e > 0 ? '+' : ''}${e}</td>
        </tr>`;
      }).join('')}</tbody></table></div>`;

  $$('[data-sm]', el).forEach(b => b.addEventListener('click', () => { statsMois = +b.dataset.sm; viewStats(el); }));

  barChart($('#ch-mois', el), mois.map(m => ({ label: moisCourt(m), full: moisLong(m), val: parMois[m] })));

  hBars($('#ch-type', el),
    TYPES.map(t => ({ label:t.label, val:parType[t.id], color:'var(--data)', dot:t.hue }))
         .sort((a,b) => b.val - a.val), total);

  hBars($('#ch-motif', el),
    MOTIFS.map(m => ({ label:m.label, val:parMotif[m.id], color:m.color, dot:m.color }))
          .filter(x => x.val > 0).sort((a,b) => b.val - a.val), total, true);

  stackBar($('#ch-per', el), [
    { label:'Conforme',       val:cptPer.ok,     color:'var(--ok)'   },
    { label:`< ${S.params.alerteJours} jours`, val:cptPer.proche, color:'var(--warn)' },
    { label:'Périmé',         val:cptPer.perime, color:'var(--crit)' },
  ]);
}

/* --- Graphique à barres verticales (12 mois, série unique) -------------- */
function barChart(host, data) {
  const W = Math.max(280, host.clientWidth || 320), H = 190;
  const padL = 26, padR = 6, padT = 22, padB = 26;
  const iw = W - padL - padR, ih = H - padT - padB;
  const max = Math.max(4, ...data.map(d => d.val));
  const step = iw / data.length;
  const bw = Math.max(8, Math.min(38, step - 6));
  const y = v => padT + ih - (v / max) * ih;
  const ticks = [0, Math.round(max / 2), max].filter((v, i, a) => a.indexOf(v) === i);
  const imax = data.reduce((b, d, i) => d.val > data[b].val ? i : b, 0);
  const every = step < 34 ? Math.ceil(34 / step) : 1;   // évite le chevauchement des mois

  host.innerHTML = `
  <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
       aria-label="Kits sortis par mois : ${data.map(d => `${d.full} ${d.val}`).join(', ')}">
    ${ticks.map(t => `<line class="c-grid" x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}"
        ${t === 0 ? 'stroke="#CBD5E1"' : 'stroke-dasharray="2 4"'}/>
      <text class="c-axis" x="${padL - 7}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join('')}
    ${data.map((d, i) => {
      const x = padL + i * step + (step - bw) / 2;
      const h = Math.max(d.val > 0 ? 3 : 0, (d.val / max) * ih);
      return `<g class="c-bar">
        <rect x="${x}" y="${y(d.val)}" width="${bw}" height="${h}" rx="4" ry="4" fill="var(--data)"
              style="animation-delay:${i * 22}ms"/>
        ${d.val > 0 ? `<rect x="${x}" y="${y(d.val) + Math.max(0, h - 5)}" width="${bw}" height="${Math.min(5, h)}" fill="var(--data)"/>` : ''}
        ${i === imax && d.val > 0 ? `<text class="c-val" x="${x + bw/2}" y="${y(d.val) - 7}" text-anchor="middle">${d.val}</text>` : ''}
        <rect class="c-hit" x="${padL + i * step}" y="${padT}" width="${step}" height="${ih}"
              data-i="${i}" tabindex="0" role="button" aria-label="${d.full} : ${d.val} kits"/>
      </g>`;
    }).join('')}
    ${data.map((d, i) => (i % every === (data.length - 1) % every)
      ? `<text class="c-axis" x="${padL + i * step + step/2}" y="${H - 8}" text-anchor="middle">${d.label}</text>` : '').join('')}
  </svg>
  <div class="tip" id="tip-mois" hidden></div>`;

  const tip = $('#tip-mois', host);
  $$('.c-hit', host).forEach(r => {
    const show = () => {
      const i = +r.dataset.i, d = data[i];
      tip.innerHTML = `${d.full} · <b>${d.val}</b> kit${d.val > 1 ? 's' : ''}`;
      tip.hidden = false;
      tip.style.left = Math.min(W - 40, Math.max(40, padL + i * step + step / 2)) + 'px';
      tip.style.top  = y(d.val) + 'px';
    };
    r.addEventListener('pointerenter', show);
    r.addEventListener('focus', show);
    r.addEventListener('pointerleave', () => tip.hidden = true);
    r.addEventListener('blur', () => tip.hidden = true);
  });
}

/* --- Barres horizontales (identité portée par le libellé) --------------- */
function hBars(host, data, total, statut = false) {
  const max = Math.max(1, ...data.map(d => d.val));
  if (!data.length || !total) {
    host.innerHTML = `<div class="empty" style="padding:24px">${ico('chart',32)}
      <strong>Aucune donnée</strong><p>Aucune sortie sur la période choisie.</p></div>`;
    return;
  }
  host.innerHTML = data.map(d => `
    <div class="hbar-row">
      <div class="hbar-top">
        ${statut ? '' : `<span class="dot" style="background:${d.dot}"></span>`}
        ${statut ? `<span class="dot" style="background:${d.color};border-radius:50%"></span>` : ''}
        <span>${esc(d.label)}</span><span class="spacer"></span>
        <span class="num" style="font-weight:800">${d.val}</span>
        <span class="num" style="color:var(--fg-3);font-size:12px;min-width:38px;text-align:right">${Math.round(d.val/total*100)} %</span>
      </div>
      <div class="hbar-track"><i class="hbar-fill" style="width:${d.val/max*100}%;background:${d.color}"></i></div>
    </div>`).join('');
}

/* --- Barre empilée (composition du stock) ------------------------------- */
function stackBar(host, parts) {
  const total = parts.reduce((n, p) => n + p.val, 0);
  if (!total) { host.innerHTML = `<div class="empty" style="padding:24px">${ico('box',32)}
    <strong>Stock vide</strong><p>Aucun kit en stock actuellement.</p></div>`; return; }
  host.innerHTML = `
    <div class="stack-bar" role="img" aria-label="${parts.map(p => `${p.label} : ${p.val}`).join(', ')}">
      ${parts.filter(p => p.val).map(p => `<i style="flex:${p.val};background:${p.color}"></i>`).join('')}
    </div>
    <div class="legend">${parts.map(p => `<span>
      <span class="dot" style="background:${p.color};border-radius:50%"></span>
      ${esc(p.label)} · <b class="num">${p.val}</b>
      <span style="color:var(--fg-3)">(${Math.round(p.val/total*100)} %)</span></span>`).join('')}</div>`;
}

/* Datamatrix / QR / code-barres. Utilise l'API native BarcodeDetector quand
   elle existe (Android, Chrome), sinon ZXing en repli (iOS, Safari).        */

let scanStop = null;

function ouvrirScanner({ titre, onResult }) {
  if (!window.isSecureContext) {
    toast('La caméra exige une adresse en https — saisie manuelle en attendant', 'err');
    return;
  }
  const box = document.createElement('div');
  box.className = 'scanner';
  box.innerHTML = `
    <video playsinline muted autoplay></video>
    <div class="scan-frame"><div class="scan-box"><div class="scan-line"></div></div></div>
    <div class="scan-top">
      <button class="icon-btn" id="sc-close" aria-label="Fermer le scanner">${ico('x',24)}</button>
      <h3>${esc(titre)}</h3>
      <button class="icon-btn" id="sc-torch" aria-label="Lampe" hidden>${ico('torch',22)}</button>
    </div>
    <div class="scan-bottom">
      <div id="sc-raw" hidden></div>
      <p id="sc-msg">Cadrez le code de l'étiquette du kit</p>
      <button class="btn btn-ghost btn-block" id="sc-manuel">Saisir à la main</button>
    </div>`;
  $('#overlay').appendChild(box);

  const video  = $('video', box);
  const msg    = $('#sc-msg', box);
  const fermer = () => { scanStop?.(); scanStop = null; box.remove(); };
  $('#sc-close', box).addEventListener('click', fermer);
  $('#sc-manuel', box).addEventListener('click', fermer);

  const traiter = raw => {
    const r = parseEtiquette(raw);
    haptic([20, 40, 20]);
    const brut = $('#sc-raw', box);
    brut.hidden = false; brut.className = 'scan-raw';
    brut.textContent = 'Code lu : ' + raw;
    if (onResult(r) !== false) fermer();
    else msg.textContent = 'Kit non trouvé — réessayez ou saisissez à la main';
  };

  demarrerCamera(video, traiter, msg, box)
    .then(stop => { scanStop = stop; })
    .catch(e => { msg.textContent = messageCamera(e); });
}

/** Traduit les erreurs de getUserMedia en consigne utilisable sur le terrain. */
function messageCamera(e) {
  switch (e?.name) {
    case 'NotAllowedError':  return "Accès caméra refusé — autorisez-le dans les réglages du navigateur, ou saisissez à la main.";
    case 'NotFoundError':    return "Aucune caméra détectée sur cet appareil.";
    case 'NotReadableError': return "La caméra est déjà utilisée par une autre application.";
    case 'SecurityError':    return "La caméra exige une adresse en https.";
    default: return 'Caméra indisponible : ' + (e?.message || e);
  }
}

/* La caméra est pilotée ici, pas par ZXing : on dessine chaque image dans un
   canvas et on la donne au décodeur. Deux raisons — l'API « camera » de ZXing
   change d'une version à l'autre, et surtout un datamatrix d'étiquette est tout
   petit : en analysant un carré recadré au centre plutôt que l'image entière,
   le code occupe bien plus de pixels et se lit beaucoup mieux.               */
async function demarrerCamera(video, onCode, msg, box) {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
  });
  video.srcObject = stream;
  await video.play().catch(() => {});

  const track = stream.getVideoTracks()[0];
  if (track?.getCapabilities?.().torch) {
    const b = $('#sc-torch', box); b.hidden = false;
    let on = false;
    b.addEventListener('click', () => {
      on = !on;
      track.applyConstraints({ advanced: [{ torch: on }] });
      b.style.background = on ? 'rgba(255,255,255,.2)' : '';
    });
  }

  let vivant = true;
  const arret = () => { vivant = false; try { stream.getTracks().forEach(t => t.stop()); } catch {} };

  // --- Le décodeur : API native quand elle existe, ZXing sinon -------------
  let decoder, moteur;
  const formats = window.BarcodeDetector ? await BarcodeDetector.getSupportedFormats().catch(() => []) : [];
  const utiles = formats.filter(f => ['data_matrix','qr_code','code_128','code_39','ean_13','pdf417'].includes(f));

  if (utiles.length) {
    const det = new BarcodeDetector({ formats: utiles });
    moteur = 'natif';
    decoder = async c => { const r = await det.detect(c); return r.length ? r[0].rawValue : null; };
  } else {
    msg.textContent = 'Chargement du lecteur…';
    const Z = await chargerZXing();
    moteur = 'ZXing';
    const hints = new Map();
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [
      Z.BarcodeFormat.DATA_MATRIX, Z.BarcodeFormat.QR_CODE,
      Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.CODE_39, Z.BarcodeFormat.EAN_13,
    ]);
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    const lecteur = new Z.MultiFormatReader();
    lecteur.setHints(hints);
    decoder = async c => {
      try {
        const src = new Z.HTMLCanvasElementLuminanceSource(c);
        return lecteur.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(src))).getText();
      } catch {
        return null;                       // rien trouvé sur cette image
      } finally {
        try { lecteur.reset(); } catch {}
      }
    };
  }
  if (!vivant) return arret;
  msg.textContent = "Cadrez le code de l'étiquette dans le carré";

  // --- Boucle d'analyse ----------------------------------------------------
  const toile = document.createElement('canvas');
  const ctx = toile.getContext('2d', { willReadFrequently: true });
  let images = 0;
  const depart = performance.now();

  /** `serre` = carré centré (le viseur), sinon l'image entière au cas où le
   *  code serait décadré. On alterne : le recadrage lit mieux, le plein cadre
   *  rattrape les erreurs de visée.                                          */
  const dessiner = serre => {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return null;
    if (serre) {
      const cote = Math.round(Math.min(vw, vh) * 0.7);
      toile.width = toile.height = cote;
      ctx.drawImage(video, (vw - cote) / 2, (vh - cote) / 2, cote, cote, 0, 0, cote, cote);
    } else {
      const ech = Math.min(1, 1280 / vw);
      toile.width = Math.round(vw * ech); toile.height = Math.round(vh * ech);
      ctx.drawImage(video, 0, 0, toile.width, toile.height);
    }
    return toile;
  };

  const boucle = async () => {
    if (!vivant) return;
    const canv = dessiner(images % 4 !== 3);        // 3 images recadrées, 1 entière
    if (canv) {
      images++;
      let texte = null;
      try { texte = await decoder(canv); } catch {}
      if (texte && vivant) { arret(); onCode(texte); return; }

      const ecoule = performance.now() - depart;
      if (ecoule > 7000 && images > 20) {
        msg.textContent = 'Rapprochez-vous du code, ou allumez la lampe';
      } else if (ecoule > 2500) {
        msg.textContent = `Recherche… (${moteur}, ${images} images analysées)`;
      }
    }
    setTimeout(boucle, 110);                        // ~9 images/s, suffisant et sobre
  };
  boucle();

  return arret;
}

function chargerZXing() {
  if (window.ZXing) return Promise.resolve(window.ZXing);
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    s.onload  = () => window.ZXing ? res(window.ZXing) : rej(new Error('lecteur non chargé'));
    s.onerror = () => rej(new Error('lecteur indisponible — pas de connexion ?'));
    document.head.appendChild(s);
  });
}

/** Lecture de l'étiquette kit : numéro, date de péremption, type.
 *  Format observé au CS (texte imprimé à côté du datamatrix) :
 *      25731
 *      31/07/2026
 *      KIT INTUBATION VSAV
 *  Gère aussi le GS1 (AI 17 péremption, AI 21 n° de série) et les codes du type
 *  « INT011 ». Le code brut reste affiché à l'écran de confirmation : si le
 *  décodage tombe à côté, cette chaîne suffit à recaler la fonction.          */
function parseEtiquette(raw) {
  const out = { raw, numero: '', peremption: '', type: '' };
  const GS = String.fromCharCode(29);                        // séparateur GS1
  let   s  = String(raw).split(GS).join('|').trim();
  // GS1 concaténé sans séparateur : on écarte le préfixe 01 + GTIN sur 14 chiffres
  // pour que les AI suivants (17 péremption, 21 n° de série) redeviennent lisibles.
  if (/^01\d{14}/.test(s)) s = '|' + s.slice(16);

  // -- date de péremption. `brut` retient le texte exact reconnu : il sera
  //    retiré avant de chercher le numéro, sans risque de couper un autre nombre.
  let m, brut = '';
  const dates = [
    [/(?:^|\D)((\d{4})-(\d{2})-(\d{2}))(?!\d)/,            (g) => `${g[2]}-${g[3]}-${g[4]}`],  // AAAA-MM-JJ
    [/(?:^|\D)((\d{2})[\/.](\d{2})[\/.](\d{4}))(?!\d)/,    (g) => `${g[4]}-${g[3]}-${g[2]}`],  // JJ/MM/AAAA
    [/(?:^|\D)((\d{2})-(\d{2})-(\d{4}))(?!\d)/,            (g) => `${g[4]}-${g[3]}-${g[2]}`],  // JJ-MM-AAAA
    [/(?:^|\|)17((\d{2})(\d{2})(\d{2}))(?!\d)/,            (g) => `20${g[2]}-${g[3]}-${g[4] === '00' ? '28' : g[4]}`], // GS1 AI 17
    [/(?:^|\D)((\d{2})[\/.\-](\d{4}))(?!\d)/,              (g) => `${g[3]}-${g[2]}-28`],       // MM/AAAA
  ];
  for (const [re, fmt] of dates) {
    if ((m = s.match(re))) { out.peremption = fmt(m); brut = m[1]; break; }
  }

  // -- numéro de kit : nombre isolé en priorité, puis jeton alphanumérique
  //    (« INT011 »), le tout après avoir écarté la date reconnue.
  if ((m = s.match(/(?:^|\|)21([A-Za-z0-9]{1,20})/))) out.numero = m[1];             // GS1 AI 21
  if (!out.numero) {
    const reste = brut ? s.split(brut).join(' ') : s;
    const plusLong = a => a.sort((x, y) => y.length - x.length)[0] || '';
    const jetons = reste.split(/[^A-Za-z0-9]+/).filter(Boolean);
    out.numero = plusLong(jetons.filter(t => /^\d{3,7}$/.test(t)))
              || plusLong(jetons.filter(t => /^[A-Za-z]{2,4}\d{2,7}$/.test(t)))
              || plusLong(reste.match(/\d{3,7}/g) || []);
  }

  // -- type de kit
  const up = sansAccent(s).toUpperCase();
  let trouve = TYPES.find(t => up.includes(sansAccent(t.label).toUpperCase()))
            || TYPES.find(t => up.includes(t.id.split('_').join(' ')))
            || (up.includes('MEMBRE') ? T.MEMBRE_SECT : null);
  if (!trouve && (m = up.match(/(?:^|[^A-Z])(INT|PER|MED|BRU|ACC|AES|MEM|MS)\s*\d/))) {
    trouve = { INT:T.INTUBATION, PER:T.PERFUSION, MED:T.MEDICAMENT, BRU:T.BRULURE,
               ACC:T.ACCOUCHEMENT, AES:T.AES, MEM:T.MEMBRE_SECT, MS:T.MEMBRE_SECT }[m[1]];
  }
  if (trouve) out.type = trouve.id;
  return out;
}

/* ---------- Dialogue bas niveau avec Supabase --------------------------- */

const SB = {
  jeton: null,   // { access_token, refresh_token, expire_le }

  /** fetch avec délai maximum : au CS, mieux vaut une erreur nette qu'une
   *  attente sans fin quand le réseau tombe. */
  async _fetch(url, options = {}, delaiMs = 12000) {
    const stop = new AbortController();
    const minuteur = setTimeout(() => stop.abort(), delaiMs);
    try {
      return await fetch(url, { ...options, signal: stop.signal });
    } catch (e) {
      throw new Error(e.name === 'AbortError' ? 'Le serveur ne répond pas' : 'Pas de connexion');
    } finally {
      clearTimeout(minuteur);
    }
  },

  _lireJeton() {
    try { this.jeton = JSON.parse(localStorage.getItem(CLE_SESSION)) || null; } catch { this.jeton = null; }
    return this.jeton;
  },
  _ecrireJeton(j) {
    this.jeton = j;
    try { j ? localStorage.setItem(CLE_SESSION, JSON.stringify(j)) : localStorage.removeItem(CLE_SESSION); } catch {}
  },
  _memoriser(reponse) {
    this._ecrireJeton({
      access_token:  reponse.access_token,
      refresh_token: reponse.refresh_token,
      expire_le:     Date.now() + (reponse.expires_in ?? 3600) * 1000 - 60000,  // 1 min de marge
    });
  },

  /** Connexion par code. Les comptes sont essayés dans l'ordre : le premier
   *  qui accepte le code donne le rôle et le nom, lus dans la table profils. */
  async connexion(code) {
    for (const email of COMPTES) {
      const r = await this._fetch(`${SUPABASE.url}/auth/v1/token?grant_type=password`, {
        method: 'POST',
        headers: { apikey: SUPABASE.anonKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: code }),
      });
      if (r.status === 400 || r.status === 401) continue;           // code refusé
      if (r.status === 429) throw new Error('Trop de tentatives, patientez une minute');
      if (!r.ok) throw new Error('Serveur indisponible (' + r.status + ')');
      this._memoriser(await r.json());
      const profils = await this.rest('profils?select=nom,role');
      if (!profils.length) {
        await this.deconnexion();
        throw new Error('Compte sans profil : lancer l\'insert into profils');
      }
      return { nom: profils[0].nom, role: profils[0].role === 'responsable' ? 'admin' : 'chef' };
    }
    return null;                                                    // aucun compte ne correspond
  },

  async deconnexion() {
    const j = this._lireJeton();
    if (j) {
      try {
        await this._fetch(`${SUPABASE.url}/auth/v1/logout`, {
          method: 'POST',
          headers: { apikey: SUPABASE.anonKey, Authorization: 'Bearer ' + j.access_token },
        }, 4000);
      } catch {}
    }
    this._ecrireJeton(null);
  },

  async _rafraichir() {
    const j = this._lireJeton();
    if (!j?.refresh_token) return false;
    const r = await this._fetch(`${SUPABASE.url}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { apikey: SUPABASE.anonKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: j.refresh_token }),
    });
    if (!r.ok) { this._ecrireJeton(null); return false; }
    this._memoriser(await r.json());
    return true;
  },

  /** Appel PostgREST authentifié. Rejoue une fois après rafraîchissement du
   *  jeton, puis renonce. */
  async rest(chemin, options = {}, deuxiemeEssai = false) {
    let j = this._lireJeton();
    if (!j) throw new Error('Session expirée');
    if (Date.now() > j.expire_le && !(await this._rafraichir())) throw new Error('Session expirée');
    j = this.jeton;

    const r = await this._fetch(`${SUPABASE.url}/rest/v1/${chemin}`, {
      ...options,
      headers: {
        apikey: SUPABASE.anonKey,
        Authorization: 'Bearer ' + j.access_token,
        'Content-Type': 'application/json',
        ...(options.headers || {}),
      },
    });

    if (r.status === 401 && !deuxiemeEssai) {
      if (await this._rafraichir()) return this.rest(chemin, options, true);
      throw new Error('Session expirée');
    }
    if (r.status === 403) throw new Error("Vous n'avez pas les droits pour cette action");
    if (!r.ok) {
      const detail = await r.json().catch(() => ({}));
      throw new Error(detail.message || `Erreur serveur (${r.status})`);
    }
    return r.status === 204 ? null : r.json().catch(() => null);
  },
};

/* ============================================================================
   16. COUCHE API
   Chaque méthode a deux chemins : Supabase quand la configuration est remplie,
   localStorage sinon. Le reste de l'application ne connaît que cet objet.
   ============================================================================ */

const API = {

  /** Sortie d'un ou plusieurs kits.
   *  Une ligne sans `id` correspond à un kit déclaré alors qu'il n'était pas
   *  en stock : elle crée un enregistrement marqué `horsInventaire`.          */
  async sortie({ lignes, nom, motif, intervention }) {
    const ts = new Date().toISOString();

    if (enLigne()) {
      let dejaSortis = 0;
      for (const l of lignes) {
        if (l.id) {
          // Le filtre `statut=eq.stock` fait le travail : si quelqu'un a sorti
          // ce kit entre-temps, la base ne renvoie aucune ligne modifiée.
          const maj = await SB.rest(`kits?id=eq.${l.id}&statut=eq.stock`, {
            method: 'PATCH',
            headers: { Prefer: 'return=representation' },
            body: JSON.stringify({
              statut: 'sorti', sortie_le: ts, sortie_par: nom,
              motif, intervention: intervention || null,
            }),
          });
          if (!maj?.length) { dejaSortis++; continue; }
        } else {
          await SB.rest('kits', {
            method: 'POST',
            body: JSON.stringify({
              type: l.type, numero: l.numero, peremption: l.peremption || null,
              entre_le: ts, entre_par: '', hors_inventaire: true,
              statut: 'sorti', sortie_le: ts, sortie_par: nom,
              motif, intervention: intervention || null,
            }),
          });
        }
      }
      await chargerDepuisSupabase();
      if (dejaSortis === lignes.length) {
        throw new Error(lignes.length > 1
          ? 'Ces kits viennent d\'être sortis par quelqu\'un d\'autre'
          : 'Ce kit vient d\'être sorti par quelqu\'un d\'autre');
      }
      return { n: lignes.length - dejaSortis, dejaSortis };
    }

    await attendre(260);
    let n = 0;
    for (const l of lignes) {
      const k = l.id ? S.kits.find(x => x.id === l.id && x.statut === 'stock') : null;
      if (k) {
        k.statut = 'sorti'; k.sortieLe = ts; k.sortiePar = nom;
        k.motif = motif; k.intervention = intervention;
      } else {
        S.kits.push({
          id: uid(), type: l.type, numero: l.numero, peremption: l.peremption || '',
          entreLe: ts, entrePar: '', horsInventaire: true,
          statut: 'sorti', sortieLe: ts, sortiePar: nom, motif, intervention,
        });
      }
      n++;
    }
    if (!n) throw new Error('Aucun kit à sortir');
    save();
    return { n, dejaSortis: 0 };
  },

  /** Entrée d'un kit neuf en stock. */
  async entree({ type, numero, peremption, par }) {
    if (enLigne()) {
      const [ligne] = await SB.rest('kits', {
        method: 'POST',
        headers: { Prefer: 'return=representation' },
        body: JSON.stringify({
          type, numero, peremption: peremption || null,
          entre_par: par, statut: 'stock',
        }),
      });
      await chargerDepuisSupabase();
      return versApp(ligne);
    }

    await attendre(220);
    const kit = {
      id: uid(), type, numero, peremption,
      entreLe: new Date().toISOString(), entrePar: par, statut: 'stock',
    };
    S.kits.push(kit); save();
    return kit;
  },

  /** Annulation d'un ajout (erreur de saisie). */
  async supprimerKit(id) {
    if (enLigne()) {
      await SB.rest(`kits?id=eq.${id}`, { method: 'DELETE' });
      await chargerDepuisSupabase();
      return;
    }
    await attendre(160);
    S.kits = S.kits.filter(k => k.id !== id); save();
  },

  /** Dotation cible d'un type de kit. */
  async majDotation(typeId, valeur) {
    S.params.dotation[typeId] = valeur;
    const t = T[typeId]; if (t) t.dot = valeur;
    if (enLigne()) {
      await SB.rest(`types_kit?id=eq.${typeId}`, {
        method: 'PATCH', body: JSON.stringify({ dotation: valeur }),
      });
      return;
    }
    save();
  },

  /** Seuil d'alerte de péremption, en jours. */
  async majAlerte(jours) {
    S.params.alerteJours = jours;
    if (enLigne()) {
      await SB.rest('parametres?cle=eq.alerte_jours', {
        method: 'PATCH', body: JSON.stringify({ valeur: jours }),
      });
      return;
    }
    save();
  },
};

      if (!/Session expirée/.test(e.message)) {
